<style>
  :root{
    --bg:#0a0a0a;
    --panel:#161616;
    --panel2:#202020;
    --border:#333333;
    --text:#f2f2f2;
    --muted:#9c9c9c;
    /* Laranja = SÓ ação/identidade (botões, aba ativa, números neutros) —
       nunca usado em gráfico/dado, pra continuar raro e chamativo onde
       importa (reorganização de papéis da Sessão 3.13, ver CLAUDE.md). */
    --accent:#ff7a29;
    --accent2:#ffa94d;
    --on-accent:#1a0f05;
    --radius:14px;
    /* Verde/amarelo/vermelho = ÚNICO vocabulário de status (na meta/perto/
       longe, erro/ok) em qualquer lugar do app — mesmo padrão em toda tela
       (princípio WHOOP, ver pesquisa da Sessão 3.12). */
    --state-good:#4ade80;
    --state-mid:#fbbf24;
    --state-bad:#ff5252;
    --danger:var(--state-bad); /* alias: erro de formulário/toast é, semanticamente, "estado ruim" */
    /* Paleta própria pros gráficos de dados (Progresso) — tons frios,
       deliberadamente fora da família laranja/estado, pra nunca competir
       visualmente com os botões nem ser confundida com bom/médio/ruim. */
    --data-1:#38bdf8;
    --data-2:#22d3ee;
    --data-3:#a78bfa;
    --data-4:#fb7185;
    --data-5:#c084fc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  /* ---- Lock screen ---- */
  #lock{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  #lock .card{
    width:100%;max-width:340px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px 22px;text-align:center;
  }
  #lock h1{font-size:1.15rem;margin:0 0 6px;}
  #lock p{color:var(--muted);font-size:0.85rem;margin:0 0 18px;}
  #lock input{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:14px;font-size:1rem;text-align:center;margin-bottom:12px;
    letter-spacing:1px;
  }
  #lock button{
    width:100%;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:14px;font-size:1rem;font-weight:700;cursor:pointer;
  }
  #lock .err{color:var(--danger);font-size:0.82rem;margin-top:10px;min-height:1.1em;}

  /* ---- App shell ---- */
  #app{display:none;max-width:720px;margin:0 auto;padding:14px 14px 90px;}
  header.top{padding:6px 2px 14px;}
  header.top h1{font-size:1.3rem;margin:0 0 2px;}
  header.top p{margin:0;color:var(--muted);font-size:0.82rem;}

  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;background:var(--panel);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--muted);font-size:0.68rem;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    cursor:pointer;border-radius:10px;
  }
  nav.tabs button .ic{font-size:1.15rem;}
  nav.tabs button.active{color:var(--accent);background:rgba(255,122,41,0.12);}

  section.view{display:none;}
  section.view.active{display:block;}

  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .panel h2{margin:0 0 4px;font-size:1.05rem;}
  .panel .sub{color:var(--muted);font-size:0.82rem;margin-bottom:12px;}

  .stat-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    flex:1 1 100px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px;text-align:center;
  }
  .stat b{display:block;font-size:1.3rem;color:var(--accent);}
  .stat span{font-size:0.72rem;color:var(--muted);}

  .daytype-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .daytype-row button{
    flex:1 1 auto;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 8px;border-radius:10px;font-size:0.8rem;cursor:pointer;
  }
  .daytype-row button.sel{border-color:var(--accent);color:var(--accent);background:rgba(255,122,41,0.12);}

  .exercise{
    border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);
  }
  .exercise h3{margin:0 0 2px;font-size:0.95rem;}
  .exercise .meta{color:var(--muted);font-size:0.76rem;margin-bottom:10px;}
  table.sets{width:100%;border-collapse:collapse;font-size:0.82rem;}
  table.sets th{color:var(--muted);font-weight:600;font-size:0.68rem;text-transform:uppercase;text-align:left;padding:0 4px 6px;}
  table.sets td{padding:4px;vertical-align:middle;}
  table.sets input[type=number]{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 4px;text-align:center;font-size:0.9rem;
  }
  .chk{width:26px;height:26px;accent-color:var(--accent);}

  .btn{
    display:inline-block;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:12px 16px;font-size:0.9rem;font-weight:700;cursor:pointer;width:100%;text-align:center;
  }
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn.small{width:auto;padding:8px 12px;font-size:0.8rem;}

  /* ---- Exercise tools: timers + execução ---- */
  .ex-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 12px;padding-top:10px;border-top:1px dashed var(--border);}
  .ex-tool-group{display:flex;align-items:center;gap:8px;}
  .ex-tool-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
  .ex-timer-display{font-variant-numeric:tabular-nums;font-size:0.95rem;font-weight:700;color:var(--accent);min-width:44px;}
  .ex-timer-btn, .rest-btn, .btn-exec{padding:6px 10px;font-size:0.76rem;}
  .rest-btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

  .rest-pill{
    position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;
    background:var(--panel2);border:1px solid var(--accent);border-radius:999px;
    padding:8px 8px 8px 16px;display:none;align-items:center;gap:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
  }
  .rest-pill.show{display:flex;}
  .rest-pill .lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;}
  .rest-pill b{color:var(--accent);font-variant-numeric:tabular-nums;font-size:1.05rem;}
  .rest-pill button{background:none;border:none;color:var(--text);font-size:1.05rem;cursor:pointer;padding:4px 8px;}

  /* ---- Video modal (Execução) — bottom-sheet ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--panel);border:1px solid var(--border);border-bottom:none;
    border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));
    max-width:480px;width:100%;position:relative;
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .modal-overlay.show .modal-box{transform:translateY(0);}
  .modal-box .sheet-handle{
    width:36px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 12px;
  }
  .modal-box h3{margin:0 0 10px;font-size:0.92rem;color:var(--text);text-align:center;}
  .video-wrap{
    position:relative;width:100%;max-width:260px;margin:0 auto;aspect-ratio:9/16;
    background:#000;border-radius:12px;overflow:hidden;
  }
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  #videoModalClose, #sessionDetailClose, #exerciseHistClose{
    position:absolute;top:10px;right:14px;width:30px;height:30px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:0.95rem;font-weight:700;
    cursor:pointer;z-index:1;
  }

  label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:11px;font-size:0.9rem;
  }
  .field textarea{min-height:70px;resize:vertical;}
  .field-check{display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--muted);margin-bottom:14px;padding:10px;background:var(--panel2);border-radius:10px;}
  .field-check input{width:auto;}

  .hist-item{border-bottom:1px solid var(--border);padding:10px 0;cursor:pointer;transition:background .15s ease;border-radius:8px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-item:active{background:var(--panel2);}
  .hist-item .row{display:flex;justify-content:space-between;font-size:0.85rem;}
  .hist-item .row b{color:var(--text);}
  .hist-item .row span{color:var(--muted);font-size:0.78rem;}
  .hist-item .chevron{color:var(--muted);font-size:0.72rem;}

  /* ---- Sessão detalhada (bottom-sheet grande, Sessão 3.17) ---- */
  .modal-box.modal-tall{max-height:88vh;display:flex;flex-direction:column;}
  #sessionDetailBody{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .modal-box h3.sd-title{text-align:left;margin-bottom:2px;padding-right:38px;}
  .sd-sub{color:var(--muted);font-size:0.78rem;margin:0 0 14px;}
  .sd-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .sd-hero-tile{background:var(--panel2);border-radius:12px;padding:10px 8px;text-align:center;}
  .sd-hero-tile b{display:block;font-size:1.3rem;color:var(--text);line-height:1.1;}
  .sd-hero-tile span{display:block;font-size:0.62rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.02em;}
  .sd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .sd-chip{display:flex;align-items:center;gap:5px;background:var(--panel2);border-radius:99px;padding:4px 10px 4px 8px;font-size:0.7rem;color:var(--text);}
  .sd-chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .sd-exercise{background:var(--panel2);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
  .sd-exercise h4{margin:0 0 6px;font-size:0.85rem;color:var(--text);}
  .sd-sets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .sd-set{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:0.7rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .sd-set.ok{color:var(--text);border-color:var(--state-good);}
  .sd-set.best{background:rgba(74,222,128,0.14);border-color:var(--state-good);color:var(--state-good);font-weight:700;}
  .sd-obs{font-size:0.8rem;color:var(--muted);white-space:pre-wrap;margin-top:4px;}
  .ex-name-btn{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;text-align:left;}
  .ex-name-btn:active{opacity:0.7;}
  .eh-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--panel2);border-radius:10px;margin-bottom:6px;font-size:0.78rem;}
  .eh-row .eh-date{color:var(--muted);flex:0 0 auto;width:70px;}
  .eh-row .eh-detail{flex:1;color:var(--text);}
  .eh-row .eh-pr{flex:0 0 auto;}
  .badge{display:inline-block;background:rgba(255,169,77,0.16);color:var(--accent2);border-radius:6px;padding:2px 8px;font-size:0.68rem;margin-right:6px;}
  .badge.warn{background:rgba(251,191,36,0.15);color:var(--state-mid);}
  .badge.pr{background:rgba(74,222,128,0.16);color:var(--state-good);}
  .progress-track{background:var(--panel2);border-radius:99px;height:8px;overflow:hidden;margin:10px 0 4px;}
  .progress-fill{background:var(--accent);height:100%;border-radius:99px;transition:width .25s ease;}
  .progress-label{font-size:0.78rem;color:var(--muted);}
  .heatmap-grid{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:3px;overflow-x:auto;padding:4px 2px 8px;}
  .heatmap-cell{width:10px;height:10px;border-radius:2px;background:var(--panel2);}
  .heatmap-cell.lvl1{background:rgba(255,122,41,0.45);}
  .heatmap-cell.lvl2{background:var(--accent);}
  .rings-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:10px 0;}
  .ring-legend{display:flex;flex-direction:column;gap:7px;font-size:0.82rem;}
  .ring-legend-item{display:flex;align-items:center;gap:7px;}
  .ring-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

  .goal-item{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin-bottom:10px;}
  .goal-item h4{margin:0 0 2px;font-size:0.88rem;}
  .goal-item p{margin:0;color:var(--muted);font-size:0.8rem;}

  .empty{color:var(--muted);font-size:0.85rem;text-align:center;padding:20px 10px;}
  .note{font-size:0.76rem;color:var(--muted);margin-top:8px;}
  .note-mini{font-size:0.7rem;color:var(--muted);opacity:0.75;margin-top:4px;}
  .load-trend{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px;}
  .badge-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--panel2);opacity:0.35;filter:grayscale(1);text-align:center;}
  .badge-chip.unlocked{opacity:1;filter:none;background:rgba(255,122,41,0.12);}
  .badge-icon{font-size:1.4rem;}
  .badge-name{font-size:0.62rem;color:var(--muted);line-height:1.2;}
  .badge-chip.unlocked .badge-name{color:var(--text);}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-nav-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;width:30px;height:30px;font-size:0.9rem;cursor:pointer;}
  .cal-nav-btn:disabled{opacity:0.3;cursor:default;}
  .cal-month-label{font-size:0.85rem;font-weight:600;color:var(--text);}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .cal-dow-label{text-align:center;font-size:0.62rem;color:var(--muted);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:0.72rem;color:var(--muted);background:var(--panel2);position:relative;}
  .cal-cell.empty{background:transparent;}
  .cal-cell.watch-only{background:rgba(56,189,248,0.14);color:var(--text);}
  .cal-cell.trained{background:rgba(74,222,128,0.18);color:var(--text);font-weight:600;}
  .cal-cell.trained.clickable{cursor:pointer;}
  .cal-cell.trained.clickable:active{opacity:0.7;}
  .cal-cell.today{outline:2px solid var(--accent);outline-offset:-2px;}
  svg.chart{width:100%;height:140px;display:block;}

  #toast{
    position:fixed;left:14px;right:14px;bottom:80px;z-index:50;
    display:flex;flex-direction:column;gap:8px;pointer-events:none;
  }
  #toast .msg{
    background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--accent);
    color:var(--text);border-radius:10px;padding:12px 14px;font-size:0.85rem;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);opacity:0;transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  #toast .msg.err{border-left-color:var(--danger);}
  #toast .msg.show{opacity:1;transform:translateY(0);}

  /* ---- Tipografia / espaçamento (ajuste fino) ---- */
  header.top h1{font-weight:800;letter-spacing:-0.02px;}
  .panel h2{font-weight:800;letter-spacing:-0.01px;}
  .panel{box-shadow:0 4px 14px rgba(0,0,0,0.25);}

  /* ---- Nav com ícones SVG (em vez de emoji) ---- */
  nav.tabs button svg{width:21px;height:21px;display:block;}
  nav.tabs button .ic{font-size:0;line-height:0;}

  /* ---- Steppers de carga/reps ---- */
  .stepper{display:flex;align-items:stretch;gap:3px;}
  .stepper input[type=number]{text-align:center;-moz-appearance:textfield;}
  .stepper input[type=number]::-webkit-inner-spin-button,
  .stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .step-btn{
    flex:0 0 26px;width:26px;background:var(--panel);border:1px solid var(--border);
    color:var(--accent);font-size:1rem;font-weight:700;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .step-btn:active{background:var(--panel2);}

  .btn-repeat{margin-bottom:8px;}

  /* ---- Semana em tiras (streak visual) ---- */
  .week-strip{display:flex;justify-content:space-between;gap:4px;margin-top:6px;}
  .week-day{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
  .week-day .dow{font-size:0.62rem;color:var(--muted);text-transform:uppercase;}
  .week-day .dot{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel2);display:flex;align-items:center;justify-content:center;
    font-size:0.68rem;color:var(--muted);
  }
  .week-day.trained .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;}
  .week-day.today .dow{color:var(--accent);font-weight:700;}

  /* ---- Mapa muscular (frente + costas lado a lado) ---- */
  .muscle-map-wrap{display:flex;gap:10px;justify-content:center;align-items:flex-start;}
  .muscle-view{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 0;max-width:180px;}
  .muscle-view-label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:700;}
  .muscle-svg-card{width:100%;background:#f3e9db;border-radius:14px;padding:6px;overflow:hidden;}
  .muscle-svg{width:100%;height:auto;display:block;}
  /* As formas de status ficam por cima da FOTO real (elemento <image> dentro
     do próprio SVG) como um "glow" translúcido em multiply — a cor tinge a
     sombra/textura real do músculo em vez de tampar a foto com um bloco liso. */
  .muscle-svg .mm-shape{cursor:pointer;mix-blend-mode:multiply;transition:opacity .15s ease, fill .25s ease;}
  .muscle-svg .mm-shape:active{opacity:0.7;}
  .muscle-svg .mm-base{pointer-events:none;}
  .muscle-legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:12px;}
  .muscle-legend .li{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--muted);}
  .muscle-legend .li .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}

  /* ---- Sessão 3.12: número-herói + estado unificado (Oura/WHOOP) ---- */
  .hero-metric{text-align:center;padding:6px 0 14px;}
  .hero-metric .hero-number{font-size:clamp(2.6rem,14vw,4rem);font-weight:800;line-height:1;color:var(--accent);}
  .hero-metric .hero-label{font-size:0.78rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.4px;}
  .ring-state-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:6px;flex:0 0 auto;}

  /* ---- Bento grid (Dashboard) ---- */
  .bento-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px;}
  .bento-tile{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
  .bento-tile.span2{grid-column:span 2;}
  .bento-tile b{display:block;font-size:1.3rem;color:var(--accent);}
  .bento-tile span{font-size:0.72rem;color:var(--muted);}
  .bento-tile.bento-hero{padding:18px 14px;}
  .bento-tile.bento-hero .hero-number{font-size:clamp(2.2rem,11vw,3.2rem);font-weight:800;line-height:1;color:var(--accent);}
  .bento-tile.bento-hero .hero-label{font-size:0.72rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.4px;}

  /* ---- Microinteração: bounce ao marcar série + celebração de PR ---- */
  .chk{transition:transform .12s ease;}
  .chk:active{transform:scale(0.82);}
  @keyframes pulseOk{0%{transform:scale(1);}35%{transform:scale(1.012);box-shadow:0 0 0 3px rgba(74,222,128,0.30);}100%{transform:scale(1);box-shadow:none;}}
  .exercise.pulse-ok{animation:pulseOk .45s ease;}
  .confetti-piece{position:fixed;width:6px;height:6px;pointer-events:none;z-index:200;border-radius:1px;opacity:1;
    animation:confettiBurst .8s cubic-bezier(.2,.6,.3,1) forwards;}
  @keyframes confettiBurst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}}

  /* ---- Barra de carga proporcional (hoje x última vez x recorde) ---- */
  .load-bar-group{margin:8px 0 6px;display:flex;flex-direction:column;gap:4px;}
  .load-bar-row{display:flex;align-items:center;gap:8px;font-size:0.68rem;color:var(--muted);}
  .load-bar-label{width:64px;flex:0 0 64px;}
  .load-bar-track{flex:1;background:var(--panel);border-radius:99px;height:6px;overflow:hidden;}
  .load-bar-fill{height:100%;border-radius:99px;transition:width .3s ease;}
  .load-bar-val{width:46px;flex:0 0 46px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}
  .vol-group{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .vol-row{display:flex;align-items:center;gap:10px;font-size:0.74rem;}
  .vol-label{width:130px;flex:0 0 130px;color:var(--text);}
  .vol-track{position:relative;flex:1;height:10px;background:var(--panel);border-radius:99px;overflow:hidden;}
  .vol-zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,0.14);}
  .vol-fill{position:absolute;top:0;bottom:0;left:0;border-radius:99px;transition:width .3s ease;}
  .vol-val{width:88px;flex:0 0 88px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
  .photo-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;}
  .photo-thumb{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--panel2);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb.selected{border-color:var(--accent);}
  .photo-thumb .pdate{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);color:#fff;font-size:0.55rem;text-align:center;padding:1px 0;}
  .photo-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .photo-compare .pc-slot{background:var(--panel2);border-radius:12px;overflow:hidden;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;}
  .photo-compare .pc-slot img{width:100%;display:block;max-height:280px;object-fit:cover;}
  .photo-compare .pc-slot .pc-label{font-size:0.7rem;color:var(--muted);padding:6px;}
  .photo-compare .pc-empty{padding:30px 10px;color:var(--muted);font-size:0.72rem;}

  /* ---- Carrossel horizontal de treinos recentes ---- */
  .carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .carousel::-webkit-scrollbar{display:none;}
  .carousel-card{flex:0 0 auto;width:148px;scroll-snap-align:start;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .carousel-card .cc-date{font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
  .carousel-card .cc-title{font-weight:700;font-size:0.86rem;margin:3px 0 8px;}
  .carousel-card .cc-stat{font-size:0.78rem;color:var(--accent);}
  .carousel-card .cc-stat.muted{color:var(--muted);margin-top:2px;}

  /* ---- Divulgação progressiva (histórico da Análise) ---- */
  .hist-item.details-item summary{cursor:pointer;list-style:none;}
  .hist-item.details-item summary::-webkit-details-marker{display:none;}
  .hist-item.details-item summary::after{content:"▾";float:right;color:var(--muted);transition:transform .2s ease;}
  .hist-item.details-item[open] summary::after{transform:rotate(180deg);}
  .hist-item.details-item .row{margin-top:8px;}

  /* ---- "Resumo do mês" estilo retrospectiva (Wrapped) ---- */
  .wrapped-overlay{position:fixed;inset:0;background:var(--bg);z-index:150;display:none;flex-direction:column;}
  .wrapped-overlay.show{display:flex;}
  .wrapped-close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:5;width:36px;height:36px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:1.1rem;cursor:pointer;}
  .wrapped-scroll{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .wrapped-card{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 28px;}
  .wrapped-card .wc-label{color:var(--muted);font-size:0.85rem;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.6px;}
  .wrapped-card .wc-number{font-size:clamp(3rem,18vw,5.5rem);font-weight:800;color:var(--accent);line-height:1;}
  .wrapped-card .wc-sub{color:var(--muted);font-size:0.85rem;margin-top:14px;max-width:280px;}
  .wrapped-dots{display:flex;justify-content:center;gap:6px;padding:14px calc(14px + env(safe-area-inset-bottom));}
  .wrapped-dots .d{width:6px;height:6px;border-radius:50%;background:var(--border);}
  .wrapped-dots .d.on{background:var(--accent);}

  /* ---- Skeleton loading (enquanto o Firestore carrega) ---- */
  .skel-line{height:14px;border-radius:6px;margin-bottom:10px;
    background:linear-gradient(90deg, var(--panel2) 25%, var(--border) 37%, var(--panel2) 63%);
    background-size:400% 100%;animation:skeletonShimmer 1.4s ease infinite;}
  .skel-line.w30{width:30%;} .skel-line.w40{width:40%;} .skel-line.w60{width:60%;} .skel-line.w90{width:90%;}
  @keyframes skeletonShimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
</style>
</head>
<body>

  <div id="lock">
    <div class="card">
      <h1>Treino e Performance</h1>
      <p>Painel pessoal de treino do Pablo</p>
      <input id="pw" type="password" inputmode="text" placeholder="Senha" autocomplete="off">
      <button id="btnEnter">Entrar</button>

  function sha256(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }

  // disparado quando um badge de PR aparece pela primeira vez numa sessão —

  // apps fitness no MEMORY.md).
  var CONFETTI_COLORS = ["#ff7a29", "#ffa94d", "#4ade80", "#38bdf8", "#fbbf24"];
  function triggerConfetti(originEl){
    if(!originEl) return;
    var rect = originEl.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    for(var i=0;i<14;i++){
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      var angle = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random()*50;
      piece.style.setProperty("--dx", (Math.cos(angle)*dist).toFixed(0) + "px");
      piece.style.setProperty("--dy", (Math.sin(angle)*dist - 20).toFixed(0) + "px");
      piece.style.setProperty("--rot", (Math.random()*360).toFixed(0) + "deg");
      piece.style.left = cx + "px";
      piece.style.top = cy + "px";
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      document.body.appendChild(piece);
      (function(p){ setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 850); })(piece);
    }
  }

  function stateColorForFraction(frac){
    if(frac >= 1) return "var(--state-good)";
    if(frac >= 0.5) return "var(--state-mid)";
    return "var(--state-bad)";

  function todayISO(){
    var d = new Date();
    var tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return tz.toISOString().slice(0,10);
  }

  // Converte uma string "YYYY-MM-DD" num Date usando o construtor LOCAL
  // (ano, mês, dia) em vez de fazer parse da string (que o JS sempre lê como
  // UTC meia-noite). Evita o bug de fuso-horário: em UTC negativo (ex.: Brasil
  // UTC-3), `new Date("2026-09-15")` na verdade representa 2026-09-14 21:00
  // no relógio local, então getDay()/getDate() nela retornam o dia ANTERIOR.
  // Usar sempre este parser (em vez de `new Date(iso)`) sempre que o próximo
  // passo for ler campos de calendário locais (getDay, getDate, etc.) — ver
  // Sessão 3.15 do MEMORY.md/CLAUDE.md.
  function parseISOToLocalDate(iso){
    var p = iso.split("-");
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }

  // Formata um Date de volta pra "YYYY-MM-DD" usando os getters LOCAIS
  // (getFullYear/getMonth/getDate), nunca toISOString() — que converte pra
  // UTC e reintroduz o mesmo bug de fuso-horário na direção contrária.
  function fmtLocalISO(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }

  function fmtDateBR(iso){
    var p = iso.split("-");
    return p[2] + "/" + p[1] + "/" + p[0];

  /* =========================================================
     TIMERS — cronômetro por exercício + cronômetro de descanso
     Arquitetura: um único setInterval global ("tick") recalcula os
     tempos a partir de timestamps reais (Date.now()), e atualiza só

     re-render do innerHTML, então sobrevive a qualquer redesenho da

  var timerState = {
    exercise: {},                              // exId -> {running, startedAt, elapsed}
    rest: {running:false, startedAt:0, total:0, remainingAtPause:0}
  };

  function fmtTime(totalSec){
    totalSec = Math.max(0, Math.round(totalSec));
    var m = Math.floor(totalSec/60), s = totalSec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  function getExTimer(exId){
    if(!timerState.exercise[exId]) timerState.exercise[exId] = {running:false, startedAt:0, elapsed:0};
    return timerState.exercise[exId];
  }

  function exTimerCurrentSeconds(exId){
    var t = getExTimer(exId);
    return t.elapsed + (t.running ? (Date.now()-t.startedAt)/1000 : 0);
  }

  function toggleExerciseTimer(exId){
    var t = getExTimer(exId);
    if(t.running){
      t.elapsed += (Date.now()-t.startedAt)/1000;
      t.running = false;
    } else {
      t.startedAt = Date.now();
      t.running = true;
    }
    updateExerciseTimerUI(exId);
  }

  function updateExerciseTimerUI(exId){
    var disp = document.getElementById("exTimerDisplay-"+exId);
    var btn = document.getElementById("exTimerBtn-"+exId);
    if(disp) disp.textContent = fmtTime(exTimerCurrentSeconds(exId));
    if(btn) btn.textContent = getExTimer(exId).running ? "⏸" : "▶";
  }

    timerState.exercise = {};

    timerState.rest = {running:true, startedAt:Date.now(), total:sec, remainingAtPause:0};
    var pill = document.getElementById("restPill");
    if(pill) pill.classList.add("show");
    var pauseBtn = document.getElementById("restPillPauseBtn");
    if(pauseBtn) pauseBtn.textContent = "⏸";
    updateRestPillDisplay(sec);
  }

  function updateRestPillDisplay(remaining){
    var el = document.getElementById("restPillTime");
    if(el) el.textContent = fmtTime(remaining);
  }

  function pauseResumeRest(){
    var r = timerState.rest;
    if(!r || (!r.running && !r.remainingAtPause)) return;
    if(r.running){
      r.remainingAtPause = r.total - (Date.now()-r.startedAt)/1000;
      r.running = false;
    } else {
      r.startedAt = Date.now();
      r.total = r.remainingAtPause;
      r.running = true;
    }
    var pauseBtn = document.getElementById("restPillPauseBtn");
    if(pauseBtn) pauseBtn.textContent = r.running ? "⏸" : "▶";
  }

  function resetRestTimer(){
    timerState.rest = {running:false, startedAt:0, total:0, remainingAtPause:0};
    var pill = document.getElementById("restPill");
    if(pill) pill.classList.remove("show");
  }

  function playBeep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
      o.connect(g); g.connect(ctx.destination);
      o.start();
      setTimeout(function(){ try{ o.stop(); ctx.close(); }catch(e){} }, 650);
    }catch(e){ /* Web Audio indisponível — segue sem som, o pill visual ainda avisa */ }
  }

  function tickTimers(){
    Object.keys(timerState.exercise).forEach(function(exId){
      if(timerState.exercise[exId].running) updateExerciseTimerUI(exId);
    });
    var r = timerState.rest;
    if(r && r.running){
      var remaining = r.total - (Date.now()-r.startedAt)/1000;
      if(remaining <= 0){
        r.running = false;
        updateRestPillDisplay(0);
        var timeEl = document.getElementById("restPillTime");
        if(timeEl) timeEl.textContent = "Pronto!";
        playBeep();
        showToast("Descanso finalizado — bora pra próxima série.");
        setTimeout(function(){ resetRestTimer(); }, 3000);
      } else {
        updateRestPillDisplay(remaining);
      }
    }
  }
  setInterval(tickTimers, 500);

  /* =========================================================
     SESSÃO DETALHADA — bottom-sheet visual ao tocar num item do
     Histórico (Sessão 3.17). Mostra o que já existe de mais rico sobre
     aquele treino específico: hero de volume/duração/RPE, quais
     grupamentos foram trabalhados naquele dia, e por exercício as
     séries feitas com uma barrinha comparando "nessa sessão" x "sessão
     anterior" x "recorde até aquela data" — mesma lógica visual do
     load-bar do Treino (Sessão 3.12), só que reancorada na DATA da
     sessão sendo vista, não em "hoje".
     ========================================================= */
  // Igual a melhorMarcaExercicio(), mas só considera sessões até (e
  // incluindo) dataLimite — pra mostrar "recorde até então" de forma
  // historicamente correta, em vez do recorde atual (que pode incluir
  // marcas feitas DEPOIS da sessão que a pessoa está revendo).
  function melhorMarcaAteData(exId, tipo, dataLimite){
    var melhor = null;
    state.sessions.forEach(function(s){
      if(s.data > dataLimite || !s.exercicios || !s.exercicios[exId]) return;
      s.exercicios[exId].forEach(function(r){
        if(!r.ok) return;
        if(tipo === "peso_tempo"){
          if(r.segundos){ var t = parseFloat(r.segundos); if(!melhor || t > melhor) melhor = t; }
        } else if(tipo === "cardio"){
          // sem "melhor marca" única, mesmo motivo de melhorMarcaExercicio.
        } else if(r.carga){
          var c = parseFloat(r.carga);
          if(!melhor || c > melhor) melhor = c;
        }
      });
    });
    return melhor;
  }

  // Igual a ultimoRegistroExercicio(), mas retorna o registro da sessão
  // ANTERIOR a dataLimite (estritamente antes) — o "última vez" visto
  // do ponto de vista de quem estava treinando naquele dia, não de hoje.
  // state.sessions já vem ordenado desc por data (query orderBy).
  function ultimoRegistroAntesDe(exId, tipo, dataLimite){
    for(var i=0;i<state.sessions.length;i++){
      var s = state.sessions[i];
      if(s.data >= dataLimite) continue;
      if(s.exercicios && s.exercicios[exId] && s.exercicios[exId].length){
        var feitos, last;
        if(tipo === "cardio"){
          feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.duracaoMin; });
          if(feitos.length){ last = feitos[feitos.length-1]; return {data: s.data, duracaoMin: last.duracaoMin, velocidade: last.velocidade}; }
        } else if(tipo === "peso_tempo"){
          feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.segundos; });
          if(feitos.length){ last = feitos[feitos.length-1]; return {data: s.data, carga: last.carga, segundos: last.segundos}; }
        } else {
          feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.carga; });
          if(feitos.length){ last = feitos[feitos.length-1]; return {data: s.data, carga: last.carga, reps: last.reps}; }
        }
      }
    }
    return null;
  }

  function nomeExercicio(sessaoTipo, exId){
    var tpl = PLANO.sessoes[sessaoTipo];
    if(tpl){
      var found = tpl.exercicios.filter(function(ex){ return ex.id === exId; })[0];
      if(found) return found.nome;
    }
    return exId;
  }

  // Barrinha comparativa reaproveitando o visual do load-bar do Treino,
  // mas com os 3 valores calculados "até a data da sessão", não "até hoje".
  function renderSessionLoadBarHtml(exId, tipo, dataSessao, valorNaSessao){
    if(tipo === "cardio") return "";
    var unidade = tipo === "peso_tempo" ? "s" : "kg";
    var anterior = ultimoRegistroAntesDe(exId, tipo, dataSessao);
    var anteriorVal = anterior ? parseFloat(tipo === "peso_tempo" ? anterior.segundos : anterior.carga) : null;
    var recordeVal = melhorMarcaAteData(exId, tipo, dataSessao);
    var vals = [valorNaSessao, anteriorVal, recordeVal].filter(function(v){ return v; });
    if(vals.length === 0) return "";
    var max = Math.max.apply(null, vals);
    function bar(label, val, color){
      if(!val) return "";
      var pct = Math.max(6, Math.round(val/max*100));
      return '<div class="load-bar-row"><span class="load-bar-label">' + label + '</span>' +
        '<div class="load-bar-track"><div class="load-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<span class="load-bar-val">' + val + unidade + '</span></div>';
    }
    return '<div class="load-bar-group">' +
      bar("Nessa sessão", valorNaSessao, "var(--accent)") +
      bar("Sessão anterior", anteriorVal, "var(--muted)") +
      bar("Recorde até então", recordeVal, "var(--state-good)") +
    '</div>';
  }

  function renderSessionDetailHtml(s){
    var totalSeries = 0, seriesFeitas = 0, volumeTotal = 0, temExercicioComCarga = false;

    var exercisesHtml = exIds.map(function(exId){
      var regs = s.exercicios[exId];
      var tipo = tpl ? tipoExercicio((tpl.exercicios.filter(function(e){ return e.id===exId; })[0]) || {}) : (regs[0] && regs[0].segundos !== undefined ? "peso_tempo" : (regs[0] && regs[0].duracaoMin !== undefined ? "cardio" : "peso_reps"));
      (MUSCLE_MAP[exId]||[]).forEach(function(mg){ gruposTrabalhados[mg] = true; });

      var melhorDaSessao = null;
      var setsHtml = regs.map(function(r){
        totalSeries++;
        if(!r.ok) return '<span class="sd-set">—</span>';
        seriesFeitas++;
        var label, valorComparavel = null;
        if(tipo === "cardio"){
          label = (r.duracaoMin||"—") + "min" + (r.velocidade ? " a " + r.velocidade + "km/h" : "");
        } else if(tipo === "peso_tempo"){

          label = (r.segundos||"—") + "s" + (r.carga && r.carga !== "0" ? " · +" + r.carga + "kg" : "");
          if(seg && (!melhorDaSessao || seg > melhorDaSessao)) melhorDaSessao = seg;
        } else {

        }

      }).join('');

      return '<div class="sd-exercise"><h4><button type="button" class="ex-name-btn" data-ex-hist="' + exId + '">' + nomeExercicio(s.sessaoTipo, exId) + '</button></h4>' +
        '<div class="sd-sets">' + setsHtml + '</div>' +

    var duracaoMin = null;
    if(s.temposExercicio){
      var totalSeg = Object.keys(s.temposExercicio).reduce(function(acc,k){ return acc + s.temposExercicio[k]; }, 0);
      if(totalSeg > 0) duracaoMin = Math.round(totalSeg / 60);
    }

    var chipsHtml = Object.keys(gruposTrabalhados).map(function(mg){
      return '<span class="sd-chip"><span class="dot" style="background:' + MUSCLE_COLORS.vermelho + '"></span>' + (MUSCLE_GROUP_LABELS[mg]||mg) + '</span>';
    }).join('');

    // Sessão 3.24: botão "Editar valores" — corrige um erro de digitação numa
    // sessão passada (ex.: carga total digitada em vez de carga por lado no
    // primeiríssimo registro de um exercício, poluindo recorde/última vez
    // dali pra frente) sem precisar de acesso direto ao Firestore de
    // produção (que eu não tenho, regra 5/17). Só aparece quando a sessão
    // tem pelo menos um exercício de carga/reps, tempo ou cardio registrado.
    var editBtnHtml = (s.exercicios && Object.keys(s.exercicios).length) ?
      '<button type="button" class="btn small secondary" id="btnEditSessionValues" data-session-id="' + s._id + '" style="margin:6px 0 4px;">✏️ Editar valores dessa sessão</button>' : '';
    return '<h3 class="sd-title">' + (s.nomeSessao||s.sessaoTipo) + '</h3>' +
      '<p class="sd-sub">' + fmtDateBR(s.data) + '</p>' +
      editBtnHtml +
      '<div class="sd-hero">' +
        '<div class="sd-hero-tile"><b>' + (duracaoMin ? duracaoMin : "—") + '</b><span>Min</span></div>' +
        '<div class="sd-hero-tile"><b>' + (temExercicioComCarga ? Math.round(volumeTotal).toLocaleString("pt-BR") : "—") + '</b><span>Volume (kg)</span></div>' +
        '<div class="sd-hero-tile"><b>' + (s.rpeGeral||"—") + '</b><span>RPE</span></div>' +
      '</div>' +
      (chipsHtml ? '<div class="sd-chips">' + chipsHtml + '</div>' : '') +
      '<p class="sub">' + seriesFeitas + '/' + totalSeries + ' séries concluídas</p>' +
      exercisesHtml +
      (s.observacoes ? '<div class="sd-exercise"><h4>Observações</h4><p class="sd-obs">' + s.observacoes + '</p></div>' : '');
  }

  // =========================================================
  // Edição de sessão passada (Sessão 3.24) — corrige valores digitados
  // errado numa sessão já salva (ex.: carga total em vez de carga por
  // lado). Só mexe nos números das séries já existentes (carga/reps/
  // segundos/duracaoMin/velocidade) — não adiciona/remove série nem
  // exercício, e não mexe no "ok" (se a série foi feita ou não), que
  // continua vindo do registro original. Ver regra 5/17: eu não tenho
  // acesso direto ao Firestore de produção do Pablo a partir daqui, então
  // essa é a forma dele corrigir um erro de digitação sozinho, sem precisar
  // mexer no console do Firebase.
  function renderSessionEditFormHtml(s){
    var exIds = s.exercicios ? Object.keys(s.exercicios) : [];
    var tpl = PLANO.sessoes[s.sessaoTipo];
    if(tpl){
      var ordem = tpl.exercicios.map(function(ex){ return ex.id; });
      exIds.sort(function(a,b){ return ordem.indexOf(a) - ordem.indexOf(b); });

      '<p class="note">Corrija só o que foi digitado errado na hora (ex.: peso total em vez de peso por lado). Recorde e "última vez" desse exercício recalculam sozinhos a partir do valor novo — não precisa mexer em mais nada.</p>';
    exIds.forEach(function(exId){
      var regs = s.exercicios[exId];
      var exDef = tpl ? (tpl.exercicios.filter(function(e){ return e.id===exId; })[0]) : null;
      var tipo = exDef ? tipoExercicio(exDef) : (regs[0] && regs[0].segundos !== undefined ? "peso_tempo" : (regs[0] && regs[0].duracaoMin !== undefined ? "cardio" : "peso_reps"));
      html += '<div class="sd-exercise"><h4>' + nomeExercicio(s.sessaoTipo, exId) + '</h4>';
      regs.forEach(function(r, i){

        } else if(tipo === "peso_tempo"){

  function saveSessionEdit(sessionId){
    var s = state.sessions.filter(function(x){ return x._id === sessionId; })[0];
    if(!s) return;
    // Clona fundo (não muta state.sessions direto — só depois que o Firestore
    // confirmar o write é que loadAll() recarrega o state de verdade).
    var novoExercicios = JSON.parse(JSON.stringify(s.exercicios));
    document.querySelectorAll("[data-edit-ex]").forEach(function(inp){
      var exId = inp.getAttribute("data-edit-ex");
      var i = parseInt(inp.getAttribute("data-edit-i"), 10);
      var f = inp.getAttribute("data-edit-f");
      if(novoExercicios[exId] && novoExercicios[exId][i]) novoExercicios[exId][i][f] = inp.value;
    });
    var btn = document.getElementById("btnSalvarEdicaoSessao");
    if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }
    db.collection(COL.sessions).doc(sessionId).update({exercicios: novoExercicios}).then(function(){
      showToast("Sessão corrigida.");
      return loadAll();
    }).then(function(){
      openSessionDetail(sessionId);
    }).catch(function(err){
      console.error(err);
      showToast("Não foi possível salvar a correção agora.", true);
      if(btn){ btn.disabled = false; btn.textContent = "Salvar correção"; }
    });
  }

  // Sessão 3.18, feature 2 — histórico dedicado por exercício: toca no nome
  // do exercício (na aba Treino ou dentro do detalhe de uma sessão) e abre
  // um sheet com a evolução completa daquele exercício específico ao longo
  // do tempo (gráfico + linha do tempo de marcas), sem precisar abrir sessão
  // por sessão pra montar esse quadro na cabeça.
  function findExercicioDef(exId){
    var chaves = Object.keys(PLANO.sessoes);
    for(var i=0;i<chaves.length;i++){
      var tpl = PLANO.sessoes[chaves[i]];
      var found = tpl.exercicios.filter(function(ex){ return ex.id === exId; })[0];
      if(found) return found;
    }
    return null;
  }

  function renderExerciseHistoryHtml(exId){
    var exDef = findExercicioDef(exId);
    var tipo = exDef ? tipoExercicio(exDef) : "peso_reps";
    var nome = exDef ? exDef.nome : exId;

    // state.sessions vem desc (mais recente primeiro); pro gráfico/linha do
    // tempo em ordem cronológica precisamos inverter.
    var cronologico = state.sessions.slice().reverse().filter(function(s){ return s.exercicios && s.exercicios[exId] && s.exercicios[exId].length; });

    var pontos = [];
    var linhas = [];
    var melhorAteAgora = null;
    cronologico.forEach(function(s){
      var feitos = s.exercicios[exId].filter(function(r){ return r.ok; });
      if(!feitos.length) return;
      var valorPrincipal = null, detalhe = "";
      if(tipo === "cardio"){
        var comVel = feitos.filter(function(r){ return r.velocidade; });
        if(!comVel.length) return;
        var melhorSessaoV = comVel.reduce(function(a,b){ return parseFloat(b.velocidade) > parseFloat(a.velocidade) ? b : a; });
        valorPrincipal = parseFloat(melhorSessaoV.velocidade);
        detalhe = (melhorSessaoV.duracaoMin||"—") + "min a " + melhorSessaoV.velocidade + "km/h";
      } else if(tipo === "peso_tempo"){
        var comSeg = feitos.filter(function(r){ return r.segundos; });
        if(!comSeg.length) return;
        var melhorSetT = comSeg.reduce(function(a,b){ return parseFloat(b.segundos) > parseFloat(a.segundos) ? b : a; });
        valorPrincipal = parseFloat(melhorSetT.segundos);
        detalhe = melhorSetT.segundos + "s" + (melhorSetT.carga && melhorSetT.carga !== "0" ? " com " + melhorSetT.carga + "kg extra" : " (peso corporal)");
      } else {
        var comCarga = feitos.filter(function(r){ return r.carga; });
        if(!comCarga.length) return;
        var melhorSetC = comCarga.reduce(function(a,b){ return parseFloat(b.carga) > parseFloat(a.carga) ? b : a; });
        valorPrincipal = parseFloat(melhorSetC.carga);
        detalhe = melhorSetC.carga + "kg × " + (melhorSetC.reps||"—");
      }
      if(valorPrincipal === null) return;
      var isPr = tipo !== "cardio" && (melhorAteAgora === null || valorPrincipal > melhorAteAgora);
      if(tipo !== "cardio" && (melhorAteAgora === null || valorPrincipal > melhorAteAgora)) melhorAteAgora = valorPrincipal;
      pontos.push({v: valorPrincipal, data: s.data});
      linhas.push({data: s.data, detalhe: detalhe, isPr: isPr});
    });

    var corLinha = tipo === "peso_tempo" ? "var(--data-3)" : (tipo === "cardio" ? "var(--data-5)" : "var(--data-2)");
    var chartHtml = pontos.length >= 2 ? sparkline(pontos, corLinha) :
      '<p class="empty">Precisa de pelo menos 2 sessões com esse exercício pra desenhar o gráfico.</p>';

    var timelineHtml = linhas.slice().reverse().map(function(l){
      return '<div class="eh-row"><span class="eh-date">' + fmtDateBR(l.data) + '</span>' +
        '<span class="eh-detail">' + l.detalhe + '</span>' +
        (l.isPr ? '<span class="eh-pr badge pr" style="position:static">🏆</span>' : '') +
      '</div>';
    }).join('');

    return '<h3 class="sd-title">' + nome + '</h3>' +
      '<p class="sd-sub">' + linhas.length + ' sessão(ões) registrada(s) com esse exercício' + (MUSCLE_MAP[exId] ? ' · ' + MUSCLE_MAP[exId].map(function(mg){ return MUSCLE_GROUP_LABELS[mg]||mg; }).join(", ") : '') + '</p>' +
      chartHtml +
      '<div style="margin-top:14px">' + (timelineHtml || '<p class="empty">Nenhum registro ainda.</p>') + '</div>';
  }

  /* =========================================================

  function ultimaSessaoTipo(){
    var academiaSessions = state.sessions.filter(function(s){ return s.sessaoTipo === "A" || s.sessaoTipo === "B"; });
    if(academiaSessions.length === 0) return null;
    return academiaSessions[0].sessaoTipo;
  }

  function proximaSessaoSugerida(){
    var ultima = ultimaSessaoTipo();
    if(ultima === "A") return "B";
    return "A";
  }

  function calcStreak(){
    if(state.sessions.length === 0) return 0;
    var dates = state.sessions.map(function(s){ return s.data; }).sort().reverse();
    var streak = 0;
    var cursor = new Date(todayISO());
    for(var i=0;i<dates.length;i++){
      var d = new Date(dates[i]);
      var diffDays = Math.round((cursor - d) / 86400000);
      if(diffDays <= (streak===0?2:4)){ streak++; cursor = d; } else { break; }
    }
    return streak;
  }

  /* =========================================================
     SEMANA EM TIRAS (calendário de streak visual)
     ========================================================= */
  function renderWeekStrip(){
    var DOW = ["D","S","T","Q","Q","S","S"];
    var todaysISO = todayISO();
    var trainedDates = {};
    state.sessions.forEach(function(s){ trainedDates[s.data] = true; });
    var html = '<div class="week-strip">';
    for(var i=6;i>=0;i--){
      // Usa o construtor local (parseISOToLocalDate) em vez de `new
      // Date(todaysISO)`: assim setDate/getDate/getDay operam sempre em
      // campos de calendário locais, sem passar por UTC no meio do caminho —
      // corrige o bug em que o dia da semana/número apareciam um dia
      // atrasado em fusos negativos (ex.: Brasil).
      var d = parseISOToLocalDate(todaysISO);
      d.setDate(d.getDate() - i);
      var iso = fmtLocalISO(d);
      var isToday = iso === todaysISO;
      var trained = !!trainedDates[iso];
      html += '<div class="week-day' + (trained?' trained':'') + (isToday?' today':'') + '">' +
        '<span class="dow">' + DOW[d.getDay()] + '</span>' +
        '<span class="dot">' + (trained ? '✓' : d.getDate()) + '</span>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  /* =========================================================
     MAPA MUSCULAR
     Status calculado só a partir de dados objetivos já registrados
     (datas de treino + séries marcadas OK) — não é interpretação de
     fadiga subjetiva (essa continua sendo feita em conversa, ver
     regra do CLAUDE.md). Categorias:
       vermelho = treinado HOJE
       azul     = treinado nas últimas 48h, sem contar hoje (janela de
                  síntese proteica)
       amarelo  = já treinado antes, mas < 12 séries na última semana
                  (abaixo da meta de volume, Pelland et al. 2025)
       verde    = recuperado/pronto (ou ainda sem dados)
     ========================================================= */
  function computeMuscleStatus(){
    var ALL_GROUPS = ALL_MUSCLE_GROUPS;
    var status = {};
    ALL_GROUPS.forEach(function(mg){ status[mg] = {status:"verde", diasDesde:null, seriesSemana:0}; });
    if(state.sessions.length === 0) return status;

    var today = new Date(todayISO());
    var last7Cutoff = new Date(today.getTime() - 7*86400000);
    var lastDateByGroup = {};
    var weekSetsByGroup = {};

    state.sessions.forEach(function(s){
      if(!s.exercicios) return;
      Object.keys(MUSCLE_MAP).forEach(function(exId){
        if(!s.exercicios[exId]) return;
        var okSets = s.exercicios[exId].filter(function(r){ return r.ok; }).length;
        if(okSets === 0) return;
        MUSCLE_MAP[exId].forEach(function(mg){
          if(!lastDateByGroup[mg] || s.data > lastDateByGroup[mg]) lastDateByGroup[mg] = s.data;
          if(new Date(s.data) >= last7Cutoff) weekSetsByGroup[mg] = (weekSetsByGroup[mg]||0) + okSets;
        });
      });
    });

    ALL_GROUPS.forEach(function(mg){
      var lastDate = lastDateByGroup[mg] || null;
      var diasDesde = lastDate ? Math.round((today - new Date(lastDate)) / 86400000) : null;
      var seriesSemana = weekSetsByGroup[mg] || 0;
      // "Vermelho" é sobre RECÊNCIA (treinado hoje), não sobre qual foi a
      // última sessão registrada no histórico — senão um grupamento treinado
      // só uma vez há muito tempo ficaria vermelho pra sempre.
      var st = "verde";
      if(diasDesde === 0) st = "vermelho";
      else if(diasDesde !== null && diasDesde <= 2) st = "azul";
      else if(diasDesde !== null && seriesSemana < 12) st = "amarelo";
      status[mg] = {status: st, diasDesde: diasDesde, seriesSemana: seriesSemana};
    });
    return status;
  }

  // v4: em vez de silhueta 100% desenhada à mão, a base agora é a FOTO real
  // (ilustração anatômica realista, fornecida pelo próprio Pablo — ver regra
  // 12/14 do CLAUDE.md) embutida como <image> dentro do SVG (base64, sem
  // arquivo externo, mantendo a regra de HTML único). Por cima da foto entram
  // elipses translúcidas (`mm-shape`, `mix-blend-mode:multiply` via CSS) que
  // tingem a região de cada grupamento com a cor do status — a foto nunca é
  // alterada, só "iluminada" por cima, exatamente como no exemplo que o
  // Pablo mandou (destaque avermelhado sobre o deltoide). A imagem de frente
  // enviada já vinha com esse destaque nos ombros; foi neutralizada (mesmo
  // tom de pele do resto do corpo, preservando sombra/luz) pra servir de
  // base neutra — a cor por cima é sempre calculada a partir do treino real.
  // v5: contornos precisos, traçados/segmentados a partir da própria foto
  // (não mais glow/elipse solta) — o Pablo pediu pra "pintar exatamente no
  // contorno do grupo muscular", como numa prancha anatômica com regiões
  // recortadas. `FRONT_PATHS`/`BACK_PATHS` guardam, por grupamento, uma lista
  // de contornos SVG (`d` de <path>) já no espaço de coordenadas do viewBox
  // de cada vista (mesma escala da foto redimensionada, sem distorcer). A
  // extração foi automática (segmentação de imagem por região conectada,
  // usando as próprias linhas anatômicas desenhadas na foto como fronteira,
  // com contorno externo simplificado via approxPolyDP) pra vista de costas
  // (linhas bem fechadas nessa foto); pra frente, onde a foto é mais
  // "sombreada"/sem linha fechada entre músculos vizinhos, os cortes internos
  // (deltoide×peitoral, deltoide×bíceps) foram calibrados manualmente sobre a
  // própria silhueta real da foto (nunca "inventados" como as elipses antigas).
  // Opacidade do preenchimento (Sessão 3.23): estava em 0.78, semi-
  // transparente sobre a foto-base. Como a foto tem sombreamento/textura
  // (pra dar volume 3D aos músculos), a mesma cor "verde" (ou azul/amarelo/
  // vermelho) aparecia com tons visivelmente diferentes dependendo de a
  // região por baixo estar mais clara ou mais sombreada (ex.: parte de cima
  // do peito vs. vinco entre músculos) — o Pablo notou isso como "tipos de
  // verde" diferentes. Não é um bug de valor de cor (MUSCLE_COLORS já usa um
  // hex único por status, aplicado igual em todo grupamento) — é o blend
  // alpha com o fundo variável. Correção: opacidade 1 (sólida), eliminando
  // qualquer influência do sombreamento da foto por baixo — mesmo tom em
  // qualquer região do corpo, sempre. Ver regra 26.
  function muscleShape(d, mg, fill){
    var mgAttr = mg ? ' class="mm-shape" data-mg="' + mg + '"' : ' class="mm-base"';
    var fillAttr = fill ? ' fill="' + fill + '" fill-opacity="1"' : '';
    return '<path d="' + d + '"' + mgAttr + fillAttr + '/>';
  }
