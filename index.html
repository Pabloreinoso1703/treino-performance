  function muscleDetailMsg(mg, info){
    var nome = MUSCLE_GROUP_LABELS[mg];
    if(info.diasDesde === null) return nome + ": ainda sem registro nesse grupamento.";
    var quando = info.diasDesde === 0 ? "hoje" : info.diasDesde === 1 ? "há 1 dia" : "há " + info.diasDesde + " dias";
    return nome + ": trabalhado por último " + quando + " · " + info.seriesSemana + " séries nos últimos 7 dias.";
  }

  // Cada grupamento pode ter mais de um contorno (ex.: costas saiu da
  // segmentação como 2-3 pedaços conectados) — todos entram com a mesma cor.
  function groupShapes(pathsByGroup, mg, fill){
    var arr = pathsByGroup[mg] || [];
    return arr.map(function(d){ return muscleShape(d, mg, fill); }).join('');
  }

  function renderMuscleFront(c){
    var W = 480, H = 1039;
    var order = ["ombros","peito","biceps","antebraco","abdomen","quadriceps","panturrilha"];
    var body = order.map(function(mg){ return groupShapes(FRONT_PATHS, mg, c(mg)); }).join('');
    return '<svg class="muscle-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
      '<image href="' + MUSCLE_PHOTO_FRONT + '" xlink:href="' + MUSCLE_PHOTO_FRONT + '" x="0" y="0" width="' + W + '" height="' + H + '"/>' +
      body +
    '</svg>';
  }

  function renderMuscleBack(c){
    var W = 480, H = 1028;
    var order = ["ombros","costas","triceps","antebraco","gluteos","posterior_coxa","panturrilha"];
    var body = order.map(function(mg){ return groupShapes(BACK_PATHS, mg, c(mg)); }).join('');
    return '<svg class="muscle-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
      '<image href="' + MUSCLE_PHOTO_BACK + '" xlink:href="' + MUSCLE_PHOTO_BACK + '" x="0" y="0" width="' + W + '" height="' + H + '"/>' +
      body +
    '</svg>';
  }

  function renderMuscleMap(){
    var status = computeMuscleStatus();
    function c(mg){ return MUSCLE_COLORS[status[mg].status]; }

    var maps = '<div class="muscle-map-wrap">' +
      '<div class="muscle-view"><span class="muscle-view-label">Frente</span><div class="muscle-svg-card">' + renderMuscleFront(c) + '</div></div>' +
      '<div class="muscle-view"><span class="muscle-view-label">Costas</span><div class="muscle-svg-card">' + renderMuscleBack(c) + '</div></div>' +
    '</div>';

    var legend = '<div class="muscle-legend">' +
      '<span class="li"><span class="dot" style="background:' + MUSCLE_COLORS.verde + '"></span>Recuperado / pronto</span>' +
      '<span class="li"><span class="dot" style="background:' + MUSCLE_COLORS.azul + '"></span>Em recuperação (&lt;48h)</span>' +
      '<span class="li"><span class="dot" style="background:' + MUSCLE_COLORS.amarelo + '"></span>Volume baixo essa semana</span>' +
      '<span class="li"><span class="dot" style="background:' + MUSCLE_COLORS.vermelho + '"></span>Trabalhado hoje</span>' +
    '</div>';

    return '<div class="panel"><h2>Mapa muscular</h2>' +
      '<p class="sub">Toque num músculo pra ver quando foi trabalhado por último. Atualiza sozinho a cada treino salvo.</p>' +
      maps + legend +
    '</div>';
  }

  function wireMuscleMapEvents(el){
    var status = computeMuscleStatus();
    el.querySelectorAll('.mm-shape').forEach(function(node){
      node.addEventListener("click", function(){
        var mg = node.getAttribute("data-mg");
        showToast(muscleDetailMsg(mg, status[mg]));
      });
    });
  }

  /* =========================================================
     DASHBOARD
     ========================================================= */
  var dayTypeChoice = null; // "completo" | "leve" | "sem"
  var analisePrefill = null; // {tipoAtividade, duracao} setado por finalizarSessao(), consumido uma vez por renderAnalise()
  var photoCompareSelection = []; // até 2 ids de foto escolhidos pra comparação lado a lado (não persiste — só estado de UI da aba Progresso)

  // Anéis de atividade estilo Apple Fitness — Força / Cardio / Tênis, um por
  // objetivo da anamnese (composição corporal via força, condicionamento via
  // cardio, transferência real pro tênis). Metas: Força usa o teto do que o
  // Pablo disse dar pra manter (2-3x/semana, ver /areas/personal-training-project
  // — aqui só o CLAUDE.md/MEMORY.md do projeto); Cardio usa a diretriz geral
  // de atividade aeróbica moderada da OMS/ACSM (~150min/semana, evidência
  // forte, referência populacional — não é algo que ele tenha dito, é uma
  // diretriz pra contextualizar); Tênis não tem meta declarada por ele, uso
  // 1x/semana como referência solta só pra dar um denominador ao anel — não é
  // regra, é só visual (deixo isso explícito no texto de apoio).
  function renderActivityRings(cutoff){
    var forcaCount = state.sessions.filter(function(s){ return (s.sessaoTipo === "A" || s.sessaoTipo === "B") && new Date(s.data) >= cutoff; }).length;
    var watchSemana = state.watch.filter(function(w){ return new Date(w.data) >= cutoff; });
    var cardioMin = 0;
    watchSemana.forEach(function(w){ if(TIPOS_ENDURANCE.indexOf(w.tipoAtividade) !== -1 && w.duracao) cardioMin += parseFloat(w.duracao) || 0; });
    var tenisCount = watchSemana.filter(function(w){ return w.tipoAtividade === "tenis"; }).length;

    var rings = [
      {label:"Força", value: forcaCount, meta: 3, unidade: "sessões", color: "#ff7a29", r: 42},
      {label:"Cardio", value: Math.round(cardioMin), meta: 150, unidade: "min", color: "#38bdf8", r: 30},
      {label:"Tênis", value: tenisCount, meta: 1, unidade: "sessões", color: "#fbbf24", r: 18}
    ];
    var cx = 60, cy = 60, strokeW = 9;
    var svgRings = rings.map(function(ring){
      var circ = 2 * Math.PI * ring.r;
      var frac = Math.min(1, ring.value / ring.meta);
      var offset = circ * (1 - frac);
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + ring.r + '" fill="none" stroke="var(--panel2)" stroke-width="' + strokeW + '"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + ring.r + '" fill="none" stroke="' + ring.color + '" stroke-width="' + strokeW + '" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    }).join('');
    var legend = rings.map(function(ring){
      var frac = ring.value / ring.meta;
      return '<div class="ring-legend-item"><span class="ring-dot" style="background:' + ring.color + '"></span>' + ring.label + ': <b>' + ring.value + '</b>/' + ring.meta + ' ' + ring.unidade +
        '<span class="ring-state-dot" style="background:' + stateColorForFraction(frac) + '" title="' + (frac>=1?"Na meta":frac>=0.5?"Quase lá":"Longe da meta") + '"></span></div>';
    }).join('');
    return '<div class="rings-row"><svg viewBox="0 0 120 120" width="132" height="132">' + svgRings + '</svg><div class="ring-legend">' + legend + '</div></div>' +
      '<p class="sub">💡 Força: meta do que você disse dar pra manter (2-3x/semana). Cardio: diretriz geral de atividade aeróbica moderada (OMS/ACSM, ~150min/semana). Tênis: referência solta de 1x/semana só pra dar escala ao anel — não é meta fixa, ajuste como quiser.</p>';
  }

  // Sessão 3.18, feature 4 — extensão dos anéis de atividade com uma
  // tendência de "carga de treino" (total de séries feitas, em média móvel
  // de 7 dias, últimas 4 semanas). Os anéis já mostram "essa semana isolada";
  // essa linha complementa mostrando se o volume está subindo, estável ou
  // caindo ao longo do tempo — só aparece quando já existe pelo menos 1
  // sessão registrada, pra não mostrar uma linha reta em zero pra quem tá
  // começando agora.
  function computeDailySets(){
    var dailySets = {};
    state.sessions.forEach(function(s){
      if(!s.exercicios) return;
      var count = 0;
      Object.keys(s.exercicios).forEach(function(exId){
        count += s.exercicios[exId].filter(function(r){ return r.ok; }).length;
      });
      dailySets[s.data] = (dailySets[s.data]||0) + count;
    });
    return dailySets;
  }

  function renderTrainingLoadTrend(){
    if(state.sessions.length === 0) return "";
    var dailySets = computeDailySets();
    var today = new Date(todayISO());
    var rolling = [];
    for(var i = 27; i >= 0; i--){
      var end = new Date(today.getTime() - i*86400000);
      var sum = 0;
      for(var j=0;j<7;j++){
        var d = new Date(end.getTime() - j*86400000);
        sum += dailySets[fmtLocalISO(d)] || 0;
      }
      rolling.push({v: sum, data: fmtLocalISO(end)});
    }
    var atual = rolling[rolling.length-1].v;
    var seteDiasAtras = rolling[rolling.length-8].v;
    var tendenciaTxt = "estável";
    if(seteDiasAtras === 0 && atual > 0) tendenciaTxt = "subindo";
    else if(atual > seteDiasAtras * 1.15) tendenciaTxt = "subindo";
    else if(atual < seteDiasAtras * 0.85) tendenciaTxt = "caindo";
    return '<div class="load-trend">' +
      '<p class="sub">Carga de treino (séries totais/semana, média móvel de 7 dias, últimas 4 semanas) — tendência: ' + tendenciaTxt + '</p>' +
      sparkline(rolling, "var(--accent2)") +
    '</div>';
  }

  // Resumo dos últimos 7 dias — anéis de força/cardio/tênis + RPE médio, pra
  // uma leitura rápida "como foi minha semana" sem ter que somar manualmente
  // entre as abas (padrão comum em apps como Whoop/Fitbod).
  function renderResumoSemana(){
    if(state.sessions.length === 0 && state.watch.length === 0) return "";
    var cutoff = new Date(new Date(todayISO()).getTime() - 6*86400000);
    var sessoesSemana = state.sessions.filter(function(s){ return new Date(s.data) >= cutoff; });
    var rpes = sessoesSemana.filter(function(s){ return s.rpeGeral; }).map(function(s){ return parseFloat(s.rpeGeral); });
    var rpeMedia = rpes.length ? (rpes.reduce(function(a,b){ return a+b; },0) / rpes.length).toFixed(1) : "—";

    // Número-herói: dias distintos com QUALQUER registro (treino ou Watch)
    // nos últimos 7 dias — o resumo mais direto de "quão consistente fui",
    // com os anéis logo abaixo detalhando o quê (padrão Oura/WHOOP de "um
    // número grande primeiro, detalhe depois" — ver Sessão 3.12 do MEMORY.md).
    var diasAtivosSet = {};
    sessoesSemana.forEach(function(s){ diasAtivosSet[s.data] = true; });
    state.watch.filter(function(w){ return new Date(w.data) >= cutoff; }).forEach(function(w){ diasAtivosSet[w.data] = true; });
    var diasAtivos = Object.keys(diasAtivosSet).length;
    var heroColor = stateColorForFraction(diasAtivos / 4); // 4 dias/semana ~ referência confortável, não meta rígida

    return '<div class="panel">' +
      '<h2>Essa semana</h2>' +
      '<div class="hero-metric"><div class="hero-number" style="color:' + heroColor + '">' + diasAtivos + '</div><div class="hero-label">dias ativos nos últimos 7</div></div>' +
      renderActivityRings(cutoff) +
      renderTrainingLoadTrend() +
      '<div class="stat-row">' +
        '<div class="stat"><b>' + rpeMedia + '</b><span>RPE médio</span></div>' +
      '</div>' +
    '</div>';
  }

  // Carrossel horizontal com scroll-snap dos últimos treinos — padrão "Para
  // você" do Apple Fitness+/Strava em vez de mais uma lista vertical (ver
  // Sessão 3.12 do MEMORY.md). Histórico completo continua na aba Histórico;
  // isso aqui é só um resumo rápido de relance no Dashboard.
  function renderRecentWorkoutsCarousel(){
    if(state.sessions.length === 0) return "";
    var recentes = state.sessions.slice(0, 8);
    var cards = recentes.map(function(s){
      var total = 0, feitas = 0;
      if(s.exercicios){
        Object.keys(s.exercicios).forEach(function(k){
          s.exercicios[k].forEach(function(r){ total++; if(r.ok) feitas++; });
        });
      }
      return '<div class="carousel-card">' +
        '<div class="cc-date">' + fmtDateBR(s.data) + '</div>' +
        '<div class="cc-title">' + (s.nomeSessao || s.sessaoTipo) + '</div>' +
        '<div class="cc-stat">' + feitas + '/' + total + ' séries</div>' +
        (s.rpeGeral ? '<div class="cc-stat muted">RPE ' + s.rpeGeral + '</div>' : '') +
      '</div>';
    }).join('');
    return '<div class="panel"><h2>Treinos recentes</h2><div class="carousel">' + cards + '</div></div>';
  }

  function renderDashboard(){
    var el = document.getElementById("view-dashboard");
    var streak = calcStreak();
    var totalSessoes = state.sessions.length;
    var sugestao = proximaSessaoSugerida();

    el.innerHTML =
      '<div class="panel">' +
        '<h2>Como está seu dia hoje?</h2>' +
        '<p class="sub">Isso decide o que aparece na aba Treino. Sem acesso automático à sua agenda ainda — é rápido, um toque.</p>' +
        '<div class="daytype-row">' +
          '<button data-day="completo">Dia completo<br><small>Folga / CC leve</small></button>' +
          '<button data-day="leve">Só um pouco de tempo</button>' +
          '<button data-day="sem">Sem treino hoje<br><small>PS Diurno / CC1</small></button>' +
        '</div>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>' + PLANO.bloco + '</h2>' +
        '<p class="sub">Progressão conservadora por ~2 semanas, depois sobe volume/carga normalmente.</p>' +
        '<div class="bento-grid">' +
          '<div class="bento-tile bento-hero span2"><div class="hero-number" style="color:' + stateColorForFraction(streak/3) + '">' + streak + '</div><div class="hero-label">dias seguidos</div></div>' +
          '<div class="bento-tile"><b>' + totalSessoes + '</b><span>treinos registrados</span></div>' +
          '<div class="bento-tile"><b>' + sugestao + '</b><span>próxima sessão</span></div>' +
        '</div>' +
        renderWeekStrip() +
      '</div>' +

      renderResumoSemana() +

      renderRecentWorkoutsCarousel() +

      (totalSessoes === 0 ? '<div class="panel"><p class="empty">Ainda não há treinos registrados. Escolha "Dia completo" acima e vá para a aba Treino para começar o primeiro.</p></div>' : '') +

      renderMuscleMap();

    el.querySelectorAll(".daytype-row button").forEach(function(btn){
      btn.addEventListener("click", function(){
        dayTypeChoice = btn.getAttribute("data-day");
        el.querySelectorAll(".daytype-row button").forEach(function(b){ b.classList.remove("sel"); });
        btn.classList.add("sel");
        if(dayTypeChoice === "completo" || dayTypeChoice === "leve"){
          setTab("treino");
        }
      });
    });
    wireMuscleMapEvents(el);
  }

  /* =========================================================
     TREINO
     ========================================================= */
  var sessaoAtual = null; // {key, registros: {exId: [{carga,reps,ok}]}}
  var prBadgeWasPr = {}; // exId -> bool, pra disparar confete só na transição p/PR (não em todo re-render)

  // Tipos de exercício: "peso_reps" (padrão, carga+reps), "peso_tempo"
  // (isométricos como prancha — carga extra opcional + segundos sustentados),
  // "cardio" (esteira/caminhada/corrida — duração + velocidade, sem séries).
  function tipoExercicio(ex){ return ex.tipo || "peso_reps"; }

  function iniciarSessao(key){
    var tpl = PLANO.sessoes[key];
    var registros = {};
    tpl.exercicios.forEach(function(ex){
      var tipo = tipoExercicio(ex);
      registros[ex.id] = [];
      for(var i=0;i<ex.series;i++){
        if(tipo === "peso_tempo") registros[ex.id].push({carga:"0", segundos:"", ok:false});
        else if(tipo === "cardio") registros[ex.id].push({duracaoMin:"", velocidade:"", ok:false});
        else registros[ex.id].push({carga:"", reps:"", ok:false});
      }
    });
    sessaoAtual = {key: key, registros: registros, rpeGeral:"", obsGeral:"", iniciadaEm: Date.now()};
    resetAllTimers();
    prBadgeWasPr = {};
    renderTreino();
  }

  function ultimoRegistroExercicio(exId, tipo){
    for(var i=0;i<state.sessions.length;i++){
      var s = state.sessions[i];
      if(s.exercicios && s.exercicios[exId] && s.exercicios[exId].length){
        var feitos, last;
        if(tipo === "cardio"){
          feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.duracaoMin; });
          if(feitos.length){ last = feitos[feitos.length-1]; return {data: s.data, duracaoMin: last.duracaoMin, velocidade: last.velocidade}; }
        } else if(tipo === "peso_tempo"){
          feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.segundos; });
          if(feitos.length){ last = feitos[feitos.length-1]; return {data: s.data, carga: last.carga, segundos: last.segundos}; }
        } else {
          feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.carga; });
          if(feitos.length){ last = feitos[feitos.length-1]; return {data: s.data, carga: last.carga, reps: last.reps}; }
        }
      }
    }
    return null;
  }

  function melhorMarcaExercicio(exId, tipo){
    var melhor = null;
    state.sessions.forEach(function(s){
      if(s.exercicios && s.exercicios[exId]){
        s.exercicios[exId].forEach(function(r){
          if(!r.ok) return;
          if(tipo === "peso_tempo"){
            if(r.segundos){ var t = parseFloat(r.segundos); if(!melhor || t > melhor) melhor = t; }
          } else if(tipo === "cardio"){
            // sem "melhor marca" única — duração e velocidade têm trade-off entre si.
          } else if(r.carga){
            var c = parseFloat(r.carga);
            if(!melhor || c > melhor) melhor = c;
          }
        });
      }
    });
    return melhor;
  }

  // Preenche a próxima série vazia com os valores da série anterior (ou,
  // se for a primeira série da sessão, com o último registro histórico
  // desse exercício) — só um toque de confirmação em vez de digitar de novo.
  // Não se aplica a exercícios "cardio" (série única, sem o que repetir).
  function fillNextSetLikeLast(exId, tipo){
    var registros = sessaoAtual.registros[exId];
    var checkField = tipo === "peso_tempo" ? "segundos" : "carga";
    var targetIdx = -1;
    for(var i=0;i<registros.length;i++){
      if(!registros[i][checkField]){ targetIdx = i; break; }
    }
    if(targetIdx === -1){ showToast("Todas as séries desse exercício já têm valor preenchido."); return; }

    var src = null;
    if(targetIdx > 0 && registros[targetIdx-1][checkField]){
      src = tipo === "peso_tempo"
        ? {carga: registros[targetIdx-1].carga, segundos: registros[targetIdx-1].segundos}
        : {carga: registros[targetIdx-1].carga, reps: registros[targetIdx-1].reps};
    } else {
      var hist = ultimoRegistroExercicio(exId, tipo);
      if(hist) src = tipo === "peso_tempo" ? {carga: hist.carga, segundos: hist.segundos} : {carga: hist.carga, reps: hist.reps};
    }
    if(!src){ showToast("Ainda não há valor anterior pra repetir nesse exercício."); return; }

    registros[targetIdx].carga = src.carga;
    if(tipo === "peso_tempo") registros[targetIdx].segundos = src.segundos;
    else registros[targetIdx].reps = src.reps;
    renderTreino();
  }

  // Barra de progresso da sessão (X/Y séries concluídas) — atualizada direto no
  // DOM a cada "OK" marcado, sem re-renderizar a tela toda (evita perder o
  // foco do campo que a pessoa está preenchendo).
  function updateSessionProgress(){
    if(!sessaoAtual) return;
    var tpl = PLANO.sessoes[sessaoAtual.key];
    var total = 0, done = 0;
    tpl.exercicios.forEach(function(ex){
      sessaoAtual.registros[ex.id].forEach(function(r){ total++; if(r.ok) done++; });
    });
    var fill = document.getElementById("sessionProgressFill");
    var label = document.getElementById("sessionProgressLabel");
    if(fill) fill.style.width = (total ? Math.round(done/total*100) : 0) + "%";
    if(label) label.textContent = done + "/" + total + " séries concluídas";
  }

  // Badge de recorde ao vivo: some quando qualquer série MARCADA OK do
  // exercício hoje supera a melhor marca histórica (carga pra peso_reps,
  // segundos pra peso_tempo). Cardio fica de fora (sem "recorde" único, ver
  // melhorMarcaExercicio). Recalcula tudo a cada mudança pra também SUMIR se
  // a pessoa desmarcar o "OK" que tinha batido o recorde.
  function updatePrBadge(exId, tipo){
    if(tipo === "cardio") return;
    var badge = document.getElementById("prBadge-" + exId);
    if(!badge) return;
    var field = tipo === "peso_tempo" ? "segundos" : "carga";
    var melhorHistorico = melhorMarcaExercicio(exId, tipo);
    var melhorHoje = null;
    sessaoAtual.registros[exId].forEach(function(r){
      if(r.ok && r[field]){
        var v = parseFloat(r[field]);
        if(v && (!melhorHoje || v > melhorHoje)) melhorHoje = v;
      }
    });
    var isPr = melhorHistorico && melhorHoje && melhorHoje > melhorHistorico;
    badge.style.display = isPr ? "inline-block" : "none";
    // Confete só no instante em que vira PR (não em todo re-render/toda
    // mudança de outro campo) — compara com o estado anterior guardado.
    if(isPr && !prBadgeWasPr[exId]) triggerConfetti(badge);
    prBadgeWasPr[exId] = !!isPr;
  }

  // Barra proporcional Hoje x Última vez x Recorde — visual em vez de só 3
  // números soltos (inspirado no calculador de anilhas do Hevy, ver Sessão
  // 3.12). Cardio fica de fora (duração/velocidade têm trade-off entre si,
  // não faz sentido uma "barra maior é melhor" única, ver melhorMarcaExercicio).
  function computeHojeMelhor(exId, tipo){
    if(!sessaoAtual || !sessaoAtual.registros[exId]) return null;
    var field = tipo === "peso_tempo" ? "segundos" : "carga";
    var melhor = null;
    sessaoAtual.registros[exId].forEach(function(r){
      if(r.ok && r[field]){
        var v = parseFloat(r[field]);
        if(v && (!melhor || v > melhor)) melhor = v;
      }
    });
    return melhor;
  }

  function renderLoadBarHtml(exId, tipo){
    if(tipo === "cardio") return "";
    var unidade = tipo === "peso_tempo" ? "s" : "kg";
    var ultimo = ultimoRegistroExercicio(exId, tipo);
    var ultimoVal = ultimo ? parseFloat(tipo === "peso_tempo" ? ultimo.segundos : ultimo.carga) : null;
    var melhorHist = melhorMarcaExercicio(exId, tipo);
    var hojeVal = computeHojeMelhor(exId, tipo);
    var vals = [hojeVal, ultimoVal, melhorHist].filter(function(v){ return v; });
    if(vals.length === 0) return '<div class="load-bar-group" id="loadBar-' + exId + '"></div>';
    var max = Math.max.apply(null, vals);
    function bar(label, val, color){
      if(!val) return "";
      var pct = Math.max(6, Math.round(val/max*100));
      return '<div class="load-bar-row"><span class="load-bar-label">' + label + '</span>' +
        '<div class="load-bar-track"><div class="load-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<span class="load-bar-val">' + val + unidade + '</span></div>';
    }
    return '<div class="load-bar-group" id="loadBar-' + exId + '">' +
      bar("Hoje", hojeVal, "var(--accent)") +
      bar("Última vez", ultimoVal, "var(--muted)") +
      bar("Recorde", melhorHist, "var(--state-good)") +
    '</div>';
  }

  function updateLoadBar(exId, tipo){
    var el = document.getElementById("loadBar-" + exId);
    if(!el) return;
    el.outerHTML = renderLoadBarHtml(exId, tipo);
  }

  function renderTreino(){
    var el = document.getElementById("view-treino");

    if(!sessaoAtual){
      el.innerHTML =
        '<div class="panel">' +
          '<h2>Escolha a sessão de hoje</h2>' +
          '<p class="sub">Sugestão com base no seu histórico: <b>' + proximaSessaoSugerida() + '</b></p>' +
          '<div class="daytype-row">' +
            '<button class="btn-sessao" data-s="A">Full-Body A</button>' +
            '<button class="btn-sessao" data-s="B">Full-Body B</button>' +
            '<button class="btn-sessao" data-s="COND">Condicionamento</button>' +
          '</div>' +
        '</div>';
      el.querySelectorAll(".btn-sessao").forEach(function(btn){
        btn.addEventListener("click", function(){ iniciarSessao(btn.getAttribute("data-s")); });
      });
      return;
    }

    var tpl = PLANO.sessoes[sessaoAtual.key];
    var totalSets = 0;
    tpl.exercicios.forEach(function(ex){ totalSets += sessaoAtual.registros[ex.id].length; });
    var html = '<div class="panel"><h2>' + tpl.nome + '</h2>' +
      '<p class="sub">' + tpl.aquecimento + ' · Duração estimada: ' + tpl.duracaoEstimada + '</p>' +
      (sessaoAtual.key !== "COND" ? '<p class="note">💡 Halter/barra com peso nos dois lados? Registre o peso de UM lado (ex.: halteres de 12kg = digite 12, não 24). Em máquina/aparelho, registre o peso total do aparelho normalmente.</p>' : '') +
      '<div class="progress-track"><div class="progress-fill" id="sessionProgressFill" style="width:0%"></div></div>' +
      '<div class="progress-label" id="sessionProgressLabel">0/' + totalSets + ' séries concluídas</div>' +
      '</div>';

    tpl.exercicios.forEach(function(ex){
      var tipo = tipoExercicio(ex);
      var ultimo = ultimoRegistroExercicio(ex.id, tipo);
      var melhor = melhorMarcaExercicio(ex.id, tipo);

      var ultimoTxt;
      if(!ultimo){
        ultimoTxt = ' · Primeira vez — essa marca vira sua base';
      } else if(tipo === "cardio"){
        ultimoTxt = ' · Última vez: ' + ultimo.duracaoMin + 'min' + (ultimo.velocidade ? ' a ' + ultimo.velocidade + 'km/h' : '');
      } else if(tipo === "peso_tempo"){
        ultimoTxt = ' · Última vez: ' + ultimo.segundos + 's' + (ultimo.carga && ultimo.carga !== "0" ? ' com ' + ultimo.carga + 'kg extra' : ' (peso corporal)');
      } else {
        ultimoTxt = ' · Última vez: ' + ultimo.carga + 'kg x ' + ultimo.reps;
      }
      var melhorTxt = "";
      if(melhor && tipo === "peso_tempo") melhorTxt = ' · Melhor marca: ' + melhor + 's';
      else if(melhor && tipo !== "cardio") melhorTxt = ' · Melhor marca: ' + melhor + 'kg';

      var metaTxt = tipo === "cardio" ? ('Meta: ' + ex.reps + ' · ' + ex.rir) : (ex.series + ' séries x ' + ex.reps + ' · RIR alvo ' + ex.rir);

      html += '<div class="exercise" data-ex="' + ex.id + '">' +
        '<h3><button type="button" class="ex-name-btn" data-ex-hist="' + ex.id + '">' + ex.nome + '</button> <span class="badge pr" id="prBadge-' + ex.id + '" style="display:none">🏆 Novo recorde!</span></h3>' +
        '<div class="meta">' + metaTxt + ultimoTxt + melhorTxt + '</div>' +
        (ex.obs ? '<div class="meta">💡 ' + ex.obs + '</div>' : '') +
        renderLoadBarHtml(ex.id, tipo) +
        (tipo !== "cardio" ? '<button class="btn small secondary btn-repeat" type="button" data-ex="' + ex.id + '" data-tipo="' + tipo + '">↺ Repetir última série</button>' : '');

      if(tipo === "cardio"){
        html += '<table class="sets"><tr><th>Duração (min)</th><th>Velocidade (km/h)</th><th>OK</th></tr>';

        if(f === "ok") sessaoAtual.registros[exId][i][f] = inp.checked;
        else sessaoAtual.registros[exId][i][f] = inp.value;
        var ex = tpl.exercicios.filter(function(e){ return e.id === exId; })[0];
        if(f === "ok") updateSessionProgress();
        if(ex){
          updatePrBadge(exId, tipoExercicio(ex));
          updateLoadBar(exId, tipoExercicio(ex));
        }
        // Timer de descanso começa sozinho ao marcar uma série como feita —
        // padrão inspirado no Hevy (regra 18 do CLAUDE.md). Cardio fica de
        // fora (série única contínua, sem "descanso entre séries").
        if(f === "ok" && inp.checked && ex){
          var tipoRest = tipoExercicio(ex);
          if(tipoRest !== "cardio") startRestTimer(tipoRest === "peso_tempo" ? 60 : 90);
          // Microanimação de confirmação (bounce no card) ao marcar série —
          // feedback tátil visual, inspirado no botão de Kudos da Strava.
          var card = inp.closest(".exercise");
          if(card){
            card.classList.remove("pulse-ok");
            void card.offsetWidth; // força reflow pra permitir reanimar em cliques seguidos
            card.classList.add("pulse-ok");
          }
        }
      });
    });
    updateSessionProgress();
    tpl.exercicios.forEach(function(ex){ updatePrBadge(ex.id, tipoExercicio(ex)); });
    document.getElementById("rpeGeral").addEventListener("input", function(e){ sessaoAtual.rpeGeral = e.target.value; });
    document.getElementById("obsGeral").addEventListener("input", function(e){ sessaoAtual.obsGeral = e.target.value; });
    document.getElementById("btnFinalizar").addEventListener("click", finalizarSessao);
    document.getElementById("btnCancelar").addEventListener("click", function(){ sessaoAtual = null; resetAllTimers(); renderTreino(); });

    el.querySelectorAll(".ex-timer-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ toggleExerciseTimer(btn.getAttribute("data-ex")); });
    });
    el.querySelectorAll(".btn-exec").forEach(function(btn){
      btn.addEventListener("click", function(){ openVideoModal(btn.getAttribute("data-ex"), btn.getAttribute("data-nome")); });
    });
    el.querySelectorAll(".rest-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ startRestTimer(parseInt(btn.getAttribute("data-sec"),10)); });
    });
    el.querySelectorAll(".btn-repeat").forEach(function(btn){
      btn.addEventListener("click", function(){ fillNextSetLikeLast(btn.getAttribute("data-ex"), btn.getAttribute("data-tipo")); });
    });
    el.querySelectorAll("[data-ex-hist]").forEach(function(btn){
      btn.addEventListener("click", function(){ openExerciseHistory(btn.getAttribute("data-ex-hist")); });
    });
    el.querySelectorAll(".step-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var exId = btn.getAttribute("data-ex"), i = parseInt(btn.getAttribute("data-i"),10), f = btn.getAttribute("data-f");
        var step = parseFloat(btn.getAttribute("data-step"));
        var op = btn.getAttribute("data-op");
        var cur = parseFloat(sessaoAtual.registros[exId][i][f]) || 0;
        var next = op === "inc" ? cur + step : Math.max(0, cur - step);
        next = Math.round(next * 100) / 100;
        sessaoAtual.registros[exId][i][f] = String(next);
        var input = el.querySelector('input[type=number][data-ex="' + exId + '"][data-i="' + i + '"][data-f="' + f + '"]');
        if(input) input.value = next;
      });
    });
  }

  function finalizarSessao(){
    var temposExercicio = {};
    Object.keys(timerState.exercise).forEach(function(exId){
      var sec = Math.round(exTimerCurrentSeconds(exId));
      if(sec > 0) temposExercicio[exId] = sec;
    });
    var doc = {
      data: todayISO(),
      sessaoTipo: sessaoAtual.key,
      nomeSessao: PLANO.sessoes[sessaoAtual.key].nome,
      exercicios: sessaoAtual.registros,
      temposExercicio: temposExercicio,
      rpeGeral: sessaoAtual.rpeGeral,
      observacoes: sessaoAtual.obsGeral,
      criadoEm: new Date().toISOString()
    };
    // Atalho Treino → Análise: pré-preenche o formulário do Watch com o tipo
    // de atividade mais provável e a duração real dessa sessão, pra reduzir
    // retrabalho de digitar tudo de novo (regra 18 do CLAUDE.md). Pra
    // condicionamento, usa a duração que a pessoa já digitou no c1 (mais
    // exata); pra força, usa o tempo de relógio desde que a sessão começou.
    var duracaoPrefill = "";
    if(sessaoAtual.key === "COND" && sessaoAtual.registros.c1 && sessaoAtual.registros.c1[0] && sessaoAtual.registros.c1[0].duracaoMin){
      duracaoPrefill = sessaoAtual.registros.c1[0].duracaoMin;
    } else if(sessaoAtual.iniciadaEm){
      duracaoPrefill = String(Math.round((Date.now() - sessaoAtual.iniciadaEm) / 60000));
    }
    var tipoPrefill = sessaoAtual.key === "COND" ? "corrida_esteira" : "forca";
    db.collection(COL.sessions).add(doc).then(function(){
      analisePrefill = {tipoAtividade: tipoPrefill, duracao: duracaoPrefill};
      sessaoAtual = null;
      resetAllTimers();
      loadAll();
      setTab("analise");
      showToast("Treino salvo! Se tiver os dados do Apple Watch, complete-os na Análise (ou marque \"sem Watch\" se não tiver).");
    }).catch(function(err){
      console.error(err);
      showToast("Não foi possível salvar o treino agora. Verifique sua conexão e tente novamente antes de sair da página.", true);
    });
  }

  function sparkline(points, color){
    if(points.length < 2) return '<p class="empty">Precisa de pelo menos 2 registros pra desenhar o gráfico.</p>';
    var w = 300, h = 120, pad = 10;
    var vals = points.map(function(p){ return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min === max){ min -= 1; max += 1; }
    var stepX = (w - pad*2) / (points.length - 1);
    var path = points.map(function(p,i){
      var x = pad + i*stepX;
      var y = h - pad - ((p.v - min) / (max - min)) * (h - pad*2);
      return (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  // Calendário de consistência estilo GitHub/Strava — uma célula por dia das
  // últimas 12 semanas, mais escura quanto mais registros houver naquele dia
  // (soma sessões de Treino + registros de Watch). Serve pra enxergar padrão
  // de aderência de forma rápida, sem contar manualmente — direto ligado ao
  // "x adherence x sustainability" que pesa nas decisões de treino (CLAUDE.md).
  function renderConsistencyHeatmap(){
    var days = 84;
    var today = new Date(todayISO());
    var countByDate = {};
    state.sessions.forEach(function(s){ countByDate[s.data] = (countByDate[s.data]||0) + 1; });
    state.watch.forEach(function(w){ countByDate[w.data] = (countByDate[w.data]||0) + 1; });

    var cells = [];
    var activeDays = 0;
    for(var i = days - 1; i >= 0; i--){
      var d = new Date(today.getTime() - i*86400000);
      var iso = d.toISOString().slice(0,10);
      var c = countByDate[iso] || 0;
      if(c > 0) activeDays++;
      var lvl = c === 0 ? "" : (c === 1 ? " lvl1" : " lvl2");
      cells.push('<div class="heatmap-cell' + lvl + '" title="' + fmtDateBR(iso) + (c ? " · " + c + " registro(s)" : " · sem registro") + '"></div>');
    }
    return '<div class="panel"><h2>Consistência</h2>' +
      '<p class="sub">' + activeDays + ' de ' + days + ' dias com algum registro (treino ou Watch) nas últimas 12 semanas.</p>' +
      '<div class="heatmap-grid">' + cells.join('') + '</div>' +
    '</div>';
  }

  // Sessão 3.18, feature 6 — calendário mensal navegável, como alternativa
  // mais "de calendário" ao heatmap de 84 dias acima (que é ótimo pra ver
  // padrão geral, mas não deixa claro QUAL dia da semana/mês foi cada
  // marca). Só navega pra trás (nunca mostra meses futuros). Dias com treino
  // registrado são clicáveis e abrem o mesmo detalhe de sessão do Histórico
  // (Sessão 3.17), pra manter os dois pontos de entrada consistentes.
  var calendarViewOffset = 0; // 0 = mês atual; negativo = meses pra trás
  function renderMonthCalendar(){
    var todayD = parseISOToLocalDate(todayISO());
    var viewDate = new Date(todayD.getFullYear(), todayD.getMonth() + calendarViewOffset, 1);
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var monthLabel = viewDate.toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
    monthLabel = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);

    var sessionByDate = {};
    state.sessions.forEach(function(s){ if(!sessionByDate[s.data]) sessionByDate[s.data] = s; });
    var watchDates = {};
    state.watch.forEach(function(w){ watchDates[w.data] = true; });

    var startDow = new Date(y, m, 1).getDay(); // 0=domingo, campo de calendário local
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var DOW = ["D","S","T","Q","Q","S","S"];

    var cells = [];
    for(var i=0;i<startDow;i++){ cells.push('<div class="cal-cell empty"></div>'); }
    for(var day=1; day<=daysInMonth; day++){
      var iso = fmtLocalISO(new Date(y, m, day));
      var isToday = iso === todayISO();
      var sessao = sessionByDate[iso];
      var temTreino = !!sessao;
      var temWatch = !!watchDates[iso];
      var cls = "cal-cell" + (isToday ? " today" : "") + (temTreino ? " trained clickable" : (temWatch ? " watch-only" : ""));
      var titulo = fmtDateBR(iso) + (temTreino ? " · treino registrado" : (temWatch ? " · Watch registrado" : ""));
      cells.push('<div class="' + cls + '"' + (temTreino ? ' data-session-id="' + sessao._id + '"' : '') + ' title="' + titulo + '">' + day + '</div>');
    }

    var isCurrentMonth = calendarViewOffset === 0;
    return '<div class="panel"><h2>Calendário mensal</h2>' +
      '<div class="cal-header">' +
        '<button class="cal-nav-btn" id="calPrevMonth" type="button">‹</button>' +
        '<span class="cal-month-label">' + monthLabel + '</span>' +
        '<button class="cal-nav-btn" id="calNextMonth" type="button"' + (isCurrentMonth ? ' disabled' : '') + '>›</button>' +
      '</div>' +
      '<div class="cal-dow-row">' + DOW.map(function(l){ return '<div class="cal-dow-label">' + l + '</div>'; }).join('') + '</div>' +
      '<div class="cal-grid">' + cells.join('') + '</div>' +
      '<p class="sub" style="margin-top:8px">🟢 treino registrado · 🔵 só Watch. Toque num dia com treino pra ver o detalhe.</p>' +
    '</div>';
  }

  function wireMonthCalendar(el){
    var prevBtn = document.getElementById("calPrevMonth");
    var nextBtn = document.getElementById("calNextMonth");
    if(prevBtn) prevBtn.addEventListener("click", function(){ calendarViewOffset--; renderProgresso(); });
    if(nextBtn) nextBtn.addEventListener("click", function(){ if(calendarViewOffset < 0){ calendarViewOffset++; renderProgresso(); } });
    el.querySelectorAll(".cal-cell[data-session-id]").forEach(function(cell){
      cell.addEventListener("click", function(){ openSessionDetail(cell.getAttribute("data-session-id")); });
    });
  }

  // Sessão 3.18, feature 1 — volume semanal por grupamento vs meta de
  // 12-20 séries/semana (referência comum de hipertrofia). Reaproveita o
  // mesmo cálculo de "seriesSemana" que já alimenta o mapa muscular
  // (computeMuscleStatus), só que aqui pra TODOS os grupamentos lado a
  // lado, com uma faixa clara na barra marcando a zona-alvo — dá pra ver
  // de relance quais grupos estão abaixo, dentro ou acima da meta.
  function renderVolumeGrupamento(){
    var status = computeMuscleStatus();
    var maxScale = 24; // teto visual do gráfico — a meta (12-20) cabe com folga antes disso
    var zoneStartPct = (12/maxScale)*100;
    var zoneWidthPct = ((20-12)/maxScale)*100;
    var rows = ALL_MUSCLE_GROUPS.map(function(mg){
      var s = status[mg].seriesSemana;
      var pct = Math.min(100, (s/maxScale)*100);
      var color = s < 12 ? "var(--state-bad)" : (s <= 20 ? "var(--state-good)" : "var(--state-mid)");
      var label = MUSCLE_GROUP_LABELS[mg].split(" (")[0];
      return '<div class="vol-row"><span class="vol-label">' + label + '</span>' +
        '<div class="vol-track"><div class="vol-zone" style="left:' + zoneStartPct.toFixed(1) + '%;width:' + zoneWidthPct.toFixed(1) + '%"></div>' +
        '<div class="vol-fill" style="width:' + pct.toFixed(1) + '%;background:' + color + '"></div></div>' +
        '<span class="vol-val">' + s + ' séries</span></div>';
    }).join('');
    return '<div class="panel"><h2>Volume semanal por grupamento</h2>' +
      '<p class="sub">Séries feitas nos últimos 7 dias vs meta de 12-20 séries/semana por grupamento (faixa clara na barra). Abaixo da faixa = pouco estímulo pra crescer; acima = pode ser volume alto demais pro grupo.</p>' +
      '<div class="vol-group">' + rows + '</div></div>';
  }

  // Sessão 3.18, feature 5 — selos/conquistas por marcos. Só 3 famílias de
  // marco, todas 100% objetivas (sem nenhuma interpretação subjetiva —
  // coerente com a regra 5 do CLAUDE.md de que interpretação de dados é
  // sempre em conversa, nunca automatizada aqui dentro): sequência de dias
  // seguidos treinando, total de treinos registrados, e % de consistência
  // nas últimas 12 semanas (mesma métrica do heatmap acima).
  var ACHIEVEMENT_BADGES = [
    {id:"streak3", icon:"🔥", label:"3 dias seguidos", check: function(s){ return s.streak >= 3; }},
    {id:"streak7", icon:"🔥", label:"7 dias seguidos", check: function(s){ return s.streak >= 7; }},
    {id:"streak14", icon:"🔥", label:"14 dias seguidos", check: function(s){ return s.streak >= 14; }},
    {id:"streak30", icon:"🔥", label:"30 dias seguidos", check: function(s){ return s.streak >= 30; }},
    {id:"sessions10", icon:"💪", label:"10 treinos", check: function(s){ return s.totalSessions >= 10; }},
    {id:"sessions25", icon:"💪", label:"25 treinos", check: function(s){ return s.totalSessions >= 25; }},
    {id:"sessions50", icon:"💪", label:"50 treinos", check: function(s){ return s.totalSessions >= 50; }},
    {id:"sessions100", icon:"💪", label:"100 treinos", check: function(s){ return s.totalSessions >= 100; }},
    {id:"consistency50", icon:"📅", label:"50% consistência (12 sem.)", check: function(s){ return s.consistencyPct >= 50; }},
    {id:"consistency75", icon:"📅", label:"75% consistência (12 sem.)", check: function(s){ return s.consistencyPct >= 75; }}
  ];

  function computeAchievementStats(){
    var days = 84;
    var today = new Date(todayISO());
    var activeDatesSet = {};
    state.sessions.forEach(function(s){ activeDatesSet[s.data] = true; });
    state.watch.forEach(function(w){ activeDatesSet[w.data] = true; });
    var activeDays = 0;
    for(var i=0;i<days;i++){
      var iso = new Date(today.getTime() - i*86400000).toISOString().slice(0,10);
      if(activeDatesSet[iso]) activeDays++;
    }
    return {
      streak: calcStreak(),
      totalSessions: state.sessions.length,
      consistencyPct: Math.round((activeDays/days)*100)
    };
  }

  function renderAchievementBadges(){
    var stats = computeAchievementStats();
    var unlockedFlags = ACHIEVEMENT_BADGES.map(function(b){ return b.check(stats); });

    var chips = ACHIEVEMENT_BADGES.map(function(b, i){
      return '<div class="badge-chip' + (unlockedFlags[i]?' unlocked':'') + '"><span class="badge-icon">' + b.icon + '</span><span class="badge-name">' + b.label + '</span></div>';
    }).join('');
    return '<div class="panel"><h2>Selos</h2>' +
      '<p class="sub">' + unlockedCount + ' de ' + ACHIEVEMENT_BADGES.length + ' selos desbloqueados — baseados só em dados objetivos (sequência, total de treinos, consistência), sem nenhuma meta que dependa de interpretação.</p>' +

  // "Resumo do mês" estilo retrospectiva (Strava Year-in-Sport/Spotify
  // Wrapped) — só ativa quando a pessoa quiser ver, não fica exibido sempre
  // (ver Sessão 3.12 do MEMORY.md). Cards com número gigante, um assunto por
  // tela, scroll horizontal com snap.
  function buildWrappedCards(){
    var cutoff = new Date(new Date(todayISO()).getTime() - 29*86400000);
    var sessoesMes = state.sessions.filter(function(s){ return new Date(s.data) >= cutoff; });
    var watchMes = state.watch.filter(function(w){ return new Date(w.data) >= cutoff; });
    var cardioMin = 0;
    watchMes.forEach(function(w){ if(TIPOS_ENDURANCE.indexOf(w.tipoAtividade) !== -1 && w.duracao) cardioMin += parseFloat(w.duracao) || 0; });
    var rpes = sessoesMes.filter(function(s){ return s.rpeGeral; }).map(function(s){ return parseFloat(s.rpeGeral); });
    var rpeMedia = rpes.length ? (rpes.reduce(function(a,b){ return a+b; },0) / rpes.length).toFixed(1) : "—";
    var streak = calcStreak();
    return [
      {label: "Últimos 30 dias", number: sessoesMes.length, sub: "treinos de força/condicionamento registrados"},
      {label: "Cardio no mês", number: Math.round(cardioMin), sub: "minutos de corrida/caminhada (Apple Watch)"},
      {label: "Esforço médio", number: rpeMedia, sub: "RPE médio das sessões do mês (escala 1-10)"},
      {label: "Sequência atual", number: streak, sub: streak === 1 ? "dia seguido treinando" : "dias seguidos treinando"}
    ];
  }

    }).join('');
    dots.innerHTML = cards.map(function(_, i){ return '<span class="d' + (i===0?' on':'') + '"></span>'; }).join('');
    scroll.scrollLeft = 0;
    scroll.onscroll = function(){
      var idx = Math.round(scroll.scrollLeft / scroll.clientWidth);
      dots.querySelectorAll(".d").forEach(function(d,i){ d.classList.toggle("on", i===idx); });

    html += '<div class="panel"><h2>FC média · Cardio (corrida/caminhada)</h2>' + sparkline(fcCardio, "var(--data-4)") +

      (zonaAltaCardio.length >= 2 ? '<p class="note">Não é a meta principal do bloco atual (dominado por zona 1-2) — serve pra confirmar que você não está acidentalmente treinando mais intenso do que o prescrito no <code>c1</code>.</p>' : '') + coverageNoteZona + '</div>';

  // Sessão 3.18, feature 3 — fotos de progresso lado a lado. Guardadas como
  // base64 dentro do próprio Firestore (sem Firebase Storage, pra não
  // complicar a arquitetura de HTML único / Firestore isolado — regra 3 do
  // CLAUDE.md), depois de comprimidas no navegador (canvas, máx. 900px de
  // lado maior, JPEG ~72%) pra caber com folga no limite de ~1MiB por
  // documento do Firestore. Comparação lado a lado é local (não persiste):
  // tocar em duas fotos na tira mostra as duas maiores, uma do lado da outra.
  function compressImageFile(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 900;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = function(){ showToast("Não foi possível processar essa imagem.", true); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ showToast("Não foi possível ler o arquivo.", true); };
    reader.readAsDataURL(file);
  }

  function renderPhotoCompareHtml(){

      if(!foto) return '<div class="pc-slot"><div class="pc-empty">Toque numa foto acima</div></div>';
      return '<div class="pc-slot"><img src="' + foto.imagem + '" alt="Foto de ' + fmtDateBR(foto.data) + '"><div class="pc-label">' + fmtDateBR(foto.data) + '</div></div>';
    }).join('');
    return '<div class="photo-compare">' + slots + '</div>';

  function renderFotosPanel(){
    var fotos = state.photos; // já vem desc (mais recente primeiro), igual state.sessions
    var stripHtml = fotos.map(function(p){
      var sel = photoCompareSelection.indexOf(p._id) !== -1;
      return '<div class="photo-thumb' + (sel?' selected':'') + '" data-photo-id="' + p._id + '"><img src="' + p.imagem + '" alt="Foto de ' + fmtDateBR(p.data) + '"><span class="pdate">' + fmtDateBR(p.data) + '</span></div>';
    }).join('');
    return '<div class="panel"><h2>Fotos de progresso</h2>' +

      '<div id="photoCompareArea">' + (fotos.length ? renderPhotoCompareHtml() : '') + '</div>' +

  function wireFotosPanel(el){
    var input = document.getElementById("photoUploadInput");
    var addBtn = document.getElementById("btnAddPhoto");
    if(addBtn && input) addBtn.addEventListener("click", function(){ input.click(); });
    if(input) input.addEventListener("change", function(){
      var file = input.files[0];
      if(!file) return;
      compressImageFile(file, function(dataUrl){
        db.collection(COL.photos).add({data: todayISO(), imagem: dataUrl, criadoEm: new Date().toISOString()})
          .then(function(){ loadAll(); })
          .catch(function(err){ console.error(err); showToast("Não foi possível salvar a foto agora.", true); });
      });
      input.value = "";
    });
    el.querySelectorAll("[data-photo-id]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-photo-id");
        var idx = photoCompareSelection.indexOf(id);
        if(idx !== -1){ photoCompareSelection.splice(idx,1); }
        else {
          if(photoCompareSelection.length >= 2) photoCompareSelection.shift();
          photoCompareSelection.push(id);
        }
        var strip = document.getElementById("photoStrip");
        if(strip) strip.querySelectorAll(".photo-thumb").forEach(function(t){
          t.classList.toggle("selected", photoCompareSelection.indexOf(t.getAttribute("data-photo-id")) !== -1);
        });
        var compareArea = document.getElementById("photoCompareArea");
        if(compareArea) compareArea.innerHTML = renderPhotoCompareHtml();
      });
    });
  }

  /* =========================================================

  // Uma sessão de treino pode gerar MAIS DE UM registro de watch no mesmo dia
  // (ex.: força + corrida, cada um com FC bem diferente) — por isso "tipo de
  // atividade" existe: sem ele, dois registros no mesmo dia ficam indistinguíveis
  // no histórico/gráficos. Sessão 3.24 — revisão dos parâmetros-chave do
  // Watch, a pedido do Pablo (ele lembrou certo: eu já tinha dito, na
  // Sessão 3.7, que "o objetivo 2 pede base aeróbica de verdade, zona 2",
  // mas o app continuava destacando "zona alta" (Z4+Z5) como SE fosse a
  // métrica principal — contradição real entre o que a prescrição do c1
  // pede (ficar a maior parte do tempo em zona 1-2) e o que a Análise
  // enfatizava). Correção: "minutos em zona 1-2" (`zona12`) é agora o proxy
  // PRIMÁRIO de condicionamento (objetivo 2 — mais minutos contínuos em
  // zona 1-2 por sessão = mais estímulo de base aeróbica real), exibido
  // antes dos outros gráficos em Progresso. "Minutos em zona alta" (Z4+Z5,
  // `zonaAlta`) continua existindo mas como VERIFICAÇÃO secundária — não
  // mede "condicionamento melhorando" nesse bloco (dominado por zona 1-2
  // de propósito), serve só pra confirmar que ele não está acidentalmente
  // treinando mais intenso do que o prescrito (ou pra ficar relevante de
  // novo quando/se entrar um bloco com trabalho específico de intensidade,
  // ver metodologia no topo do arquivo). FC média continua relevante pro
  // objetivo 3 (FC menor pro mesmo esforço) mas só é comparável entre
  // sessões de ritmo/esforço parecido — isso fica pra conversa (regra 5),
  // não pra um número isolado no gráfico.
  var TIPOS_ATIVIDADE = {
    forca: "Treino tradicional de força",
    caminhada_externa: "Caminhada ao ar livre",
    corrida_esteira: "Corrida interna (esteira)",
    caminhada_esteira: "Caminhada interna (esteira)",
    tenis: "Tênis",
    outro: "Outro"
  };
  // Tipos "de endurance" pros gráficos de FC/zona alta em Progresso — força e
  // tênis ficam de fora porque a lógica de esforço/FC deles é diferente
  // (força é mais sobre séries/carga; tênis é esforço intermitente, não
  // contínuo, então FC média não é comparável com corrida/caminhada contínua).
  var TIPOS_ENDURANCE = ["caminhada_externa", "corrida_esteira", "caminhada_esteira"];

          '<div class="row"><span>' + (w.duracao?w.duracao+"min":"") + (w.distancia?" · "+w.distancia+"km":"") + (w.ritmo?" · "+w.ritmo:"") + (w.fcMedia?" · FC méd "+w.fcMedia:"") + (w.fcMax?" (máx "+w.fcMax+")":"") + '</span>' +
          '<span>' + (w.zona12 ? w.zona12+"min em zona 1-2" : "") + (w.zonaAlta ? (w.zona12?" · ":"") + w.zonaAlta+"min em zona 4-5" : "") + '</span></div>' +
          (w.observacoes ? '<div class="row"><span>' + w.observacoes + '</span></div>' : '') +
          // Sessão 3.25: edição de registro do Apple Watch já salvo — mesmo
          // motivo da edição de sessão (regra 23): campo novo (zona12) não
          // existia antes, então um registro antigo/de hoje pode precisar
          // ganhar esse valor depois de já salvo, e eu não tenho acesso
          // direto ao Firestore de produção pra fazer isso por ele.
          '<div class="row"><button type="button" class="btn small secondary" data-watch-edit="' + w._id + '">✏️ Editar esse registro</button></div>' +
        '</details>';
      });
    }
    html += '</div>';

    el.innerHTML = html;
    var semWatchEl = document.getElementById("wSemWatch");
    var camposWatchEl = document.getElementById("wCamposWatch");
    semWatchEl.addEventListener("change", function(){
      camposWatchEl.style.display = semWatchEl.checked ? "none" : "";
    });
    document.getElementById("btnSalvarAnalise").addEventListener("click", function(){
      var semWatch = semWatchEl.checked;
      var doc = {
        data: todayISO(),
        tipoAtividade: document.getElementById("wTipo").value,
        duracao: document.getElementById("wDuracao").value,
        // Sem dados do Watch: os campos biométricos ficam em branco de
        // propósito (não é falta de preenchimento, é a marca explícita de
        // "não medido dessa vez") — regra 24 do CLAUDE.md.
        distancia: semWatch ? "" : document.getElementById("wDistancia").value,
        ritmo: semWatch ? "" : document.getElementById("wRitmo").value,
        fcMedia: semWatch ? "" : document.getElementById("wFcMedia").value,
        fcMax: semWatch ? "" : document.getElementById("wFcMax").value,
        zona12: semWatch ? "" : document.getElementById("wZona12").value,
        zonaAlta: semWatch ? "" : document.getElementById("wZonaAlta").value,
        calorias: semWatch ? "" : document.getElementById("wCalorias").value,
        rpe: document.getElementById("wRpe").value,
        sono: document.getElementById("wSono").value,
        observacoes: document.getElementById("wObs").value,
        semWatch: semWatch,
        criadoEm: new Date().toISOString()
      };
      db.collection(COL.watch).add(doc).then(function(){ loadAll(); setTab("analise"); })
        .catch(function(err){ console.error(err); showToast("Não foi possível salvar agora.", true); });
    });
    document.querySelectorAll("[data-watch-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){ openWatchEdit(btn.getAttribute("data-watch-edit")); });
    });
  }

  // Sessão 3.25: edição de um registro já salvo do Apple Watch (COL.watch),
  // mesmo padrão da edição de sessão passada (regra 23) — motivada dessa vez
  // por um campo novo (zona12) que não existia quando registros antigos
  // foram salvos. Substitui o conteúdo inteiro da aba Análise por um
  // formulário só daquele registro; "Cancelar"/"Salvar correção" voltam a
  // chamar renderAnalise() (que já refaz o formulário de registro novo +
  // lista atualizada), então não precisa de nenhum estado de UI extra pra
  // sair do modo edição.
  function renderWatchEditFormHtml(w){
    var tipoLabel = TIPOS_ATIVIDADE[w.tipoAtividade] || "";
    var html = '<div class="panel">' +
      '<h2>Editar registro do Apple Watch</h2>' +
      '<p class="sub">' + fmtDateBR(w.data) + (tipoLabel ? ' · ' + tipoLabel : '') + '</p>' +
      '<p class="note">Corrija ou complete valores desse registro (ex.: campo que não existia quando você salvou, como "zona 1-2"). Não muda a data nem o tipo de atividade — só os números.</p>' +
      '<label class="field-check"><input type="checkbox" id="weSemWatch"' + (w.semWatch ? ' checked' : '') + '> Sem dados do Apple Watch nessa sessão</label>' +
      '<div id="weCamposWatch">' +
      '<div class="field"><label>Distância (km, se aplicável)</label><input type="number" step="0.01" id="weDistancia" value="' + (w.distancia||'') + '"></div>' +
      '<div class="field"><label>Ritmo médio (min/km, se corrida)</label><input type="text" placeholder="Ex: 7min40s/km" id="weRitmo" value="' + (w.ritmo||'') + '"></div>' +
      '<div class="field"><label>FC média (bpm)</label><input type="number" id="weFcMedia" value="' + (w.fcMedia||'') + '"></div>' +
      '<div class="field"><label>FC máxima (bpm)</label><input type="number" id="weFcMax" value="' + (w.fcMax||'') + '"></div>' +
      '<div class="field"><label>Minutos em zona 1-2 (base aeróbica — o alvo do plano atual, ver Análise)</label><input type="number" step="0.1" id="weZona12" value="' + (w.zona12||'') + '"></div>' +
      '<div class="field"><label>Minutos em zona 4-5 (intensidade alta — verificação, não a meta principal agora)</label><input type="number" step="0.1" id="weZonaAlta" value="' + (w.zonaAlta||'') + '"></div>' +
      '<div class="field"><label>Calorias ativas (kcal)</label><input type="number" id="weCalorias" value="' + (w.calorias||'') + '"></div>' +
      '</div>' +
      '<div class="field"><label>Duração (min)</label><input type="number" id="weDuracao" value="' + (w.duracao||'') + '"></div>' +
      '<div class="field"><label>RPE/Esforço desse treino (1-10)</label><input type="number" min="1" max="10" id="weRpe" value="' + (w.rpe||'') + '"></div>' +
      '<div class="field"><label>Sono da noite anterior (horas aprox.)</label><input type="number" step="0.5" id="weSono" value="' + (w.sono||'') + '"></div>' +
      '<div class="field"><label>Sensação de recuperação/fadiga</label><textarea id="weObs" placeholder="Ex: senti mais cansado que o normal, dor leve no ombro, etc.">' + (w.observacoes||'') + '</textarea></div>' +
      '<div style="display:flex;gap:8px;margin-top:10px;">' +
        '<button class="btn" id="btnSalvarEdicaoWatch">Salvar correção</button>' +
        '<button class="btn secondary" id="btnCancelarEdicaoWatch">Cancelar</button>' +
      '</div>' +
      '</div>';
    return html;
  }

  function openWatchEdit(watchId){
    var w = state.watch.filter(function(x){ return x._id === watchId; })[0];
    if(!w) return;
    var el = document.getElementById("view-analise");
    el.innerHTML = renderWatchEditFormHtml(w);
    var semWatchEl = document.getElementById("weSemWatch");
    var camposWatchEl = document.getElementById("weCamposWatch");
    camposWatchEl.style.display = semWatchEl.checked ? "none" : "";
    semWatchEl.addEventListener("change", function(){
      camposWatchEl.style.display = semWatchEl.checked ? "none" : "";
    });
    document.getElementById("btnCancelarEdicaoWatch").addEventListener("click", function(){ renderAnalise(); });
    document.getElementById("btnSalvarEdicaoWatch").addEventListener("click", function(){ saveWatchEdit(watchId); });
  }

  function saveWatchEdit(watchId){
    var semWatch = document.getElementById("weSemWatch").checked;
    var partial = {
      duracao: document.getElementById("weDuracao").value,
      distancia: semWatch ? "" : document.getElementById("weDistancia").value,
      ritmo: semWatch ? "" : document.getElementById("weRitmo").value,
      fcMedia: semWatch ? "" : document.getElementById("weFcMedia").value,
      fcMax: semWatch ? "" : document.getElementById("weFcMax").value,
      zona12: semWatch ? "" : document.getElementById("weZona12").value,
      zonaAlta: semWatch ? "" : document.getElementById("weZonaAlta").value,
      calorias: semWatch ? "" : document.getElementById("weCalorias").value,
      rpe: document.getElementById("weRpe").value,
      sono: document.getElementById("weSono").value,
      observacoes: document.getElementById("weObs").value,
      semWatch: semWatch
    };
    var btn = document.getElementById("btnSalvarEdicaoWatch");
    if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }
    db.collection(COL.watch).doc(watchId).update(partial).then(function(){
      showToast("Registro do Apple Watch corrigido.");
      return loadAll();
    }).then(function(){
      renderAnalise();
    }).catch(function(err){
      console.error(err);
      showToast("Não foi possível salvar a correção agora.", true);
      if(btn){ btn.disabled = false; btn.textContent = "Salvar correção"; }
    });
  }

  /* =========================================================
     OBJETIVOS
     ========================================================= */
  var METAS = [
    {prazo:"4 semanas", texto:"Completar 70-80% das sessões planejadas, progressão de carga documentada nos exercícios principais, e 1º teste de referência de condicionamento registrado."},
    {prazo:"3 meses", texto:"Ganho de força mensurável nos principais movimentos, melhora perceptível de resistência vs. linha de base do mês 1, refeição extra incorporada como hábito."},
    {prazo:"6-12 meses", texto:"Composição corporal: aproximadamente -3% a -5% de gordura corporal e +1 a 3kg de massa magra. Condicionamento com FC mais eficiente para o mesmo esforço, com transferência real pro tênis."}
  ];

  function renderObjetivos(){
    var el = document.getElementById("view-objetivos");
    var html = '<div class="panel"><h2>Objetivo principal</h2>' +
      '<p class="sub">Composição corporal + condicionamento físico, com transferência real pro tênis, e eficiência cardiovascular (FC menor para o mesmo esforço).</p></div>';
    html += '<div class="panel"><h2>Metas por prazo</h2>';
    METAS.forEach(function(m){
      html += '<div class="goal-item"><h4>' + m.prazo + '</h4><p>' + m.texto + '</p></div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

})();
</script>
</body>
</html>
