<style>
  :root{
    --bg:#0a0a0a;
    --panel:#161616;
    --panel2:#202020;
    --border:#333333;
    --text:#f2f2f2;
    --muted:#9c9c9c;
    --accent:#ff7a29;
    --accent2:#ffa94d;
    --on-accent:#1a0f05;
    --warn:#ffcc66;
    --danger:#ff5252;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  /* ---- Lock screen ---- */
  #lock{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  #lock .card{
    width:100%;max-width:340px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px 22px;text-align:center;
  }
  #lock h1{font-size:1.15rem;margin:0 0 6px;}
  #lock p{color:var(--muted);font-size:0.85rem;margin:0 0 18px;}
  #lock input{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:14px;font-size:1rem;text-align:center;margin-bottom:12px;
    letter-spacing:1px;
  }
  #lock button{
    width:100%;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:14px;font-size:1rem;font-weight:700;cursor:pointer;
  }
  #lock .err{color:var(--danger);font-size:0.82rem;margin-top:10px;min-height:1.1em;}

  /* ---- App shell ---- */
  #app{display:none;max-width:720px;margin:0 auto;padding:14px 14px 90px;}
  header.top{padding:6px 2px 14px;}
  header.top h1{font-size:1.3rem;margin:0 0 2px;}
  header.top p{margin:0;color:var(--muted);font-size:0.82rem;}

  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;background:var(--panel);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--muted);font-size:0.68rem;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    cursor:pointer;border-radius:10px;
  }
  nav.tabs button .ic{font-size:1.15rem;}
  nav.tabs button.active{color:var(--accent);background:rgba(255,122,41,0.12);}

  section.view{display:none;}
  section.view.active{display:block;}

  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .panel h2{margin:0 0 4px;font-size:1.05rem;}
  .panel .sub{color:var(--muted);font-size:0.82rem;margin-bottom:12px;}

  .stat-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{
    flex:1 1 100px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px;text-align:center;
  }
  .stat b{display:block;font-size:1.3rem;color:var(--accent);}
  .stat span{font-size:0.72rem;color:var(--muted);}

  .daytype-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .daytype-row button{
    flex:1 1 auto;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 8px;border-radius:10px;font-size:0.8rem;cursor:pointer;
  }
  .daytype-row button.sel{border-color:var(--accent);color:var(--accent);background:rgba(255,122,41,0.12);}

  .exercise{
    border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);
  }
  .exercise h3{margin:0 0 2px;font-size:0.95rem;}
  .exercise .meta{color:var(--muted);font-size:0.76rem;margin-bottom:10px;}
  table.sets{width:100%;border-collapse:collapse;font-size:0.82rem;}
  table.sets th{color:var(--muted);font-weight:600;font-size:0.68rem;text-transform:uppercase;text-align:left;padding:0 4px 6px;}
  table.sets td{padding:4px;vertical-align:middle;}
  table.sets input[type=number]{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 4px;text-align:center;font-size:0.9rem;
  }
  .chk{width:26px;height:26px;accent-color:var(--accent);}

  .btn{
    display:inline-block;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:12px 16px;font-size:0.9rem;font-weight:700;cursor:pointer;width:100%;text-align:center;
  }
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn.small{width:auto;padding:8px 12px;font-size:0.8rem;}

  /* ---- Exercise tools: timers + execução ---- */
  .ex-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 12px;padding-top:10px;border-top:1px dashed var(--border);}
  .ex-tool-group{display:flex;align-items:center;gap:8px;}
  .ex-tool-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
  .ex-timer-display{font-variant-numeric:tabular-nums;font-size:0.95rem;font-weight:700;color:var(--accent);min-width:44px;}
  .ex-timer-btn, .rest-btn, .btn-exec{padding:6px 10px;font-size:0.76rem;}
  .rest-btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

  .rest-pill{
    position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;
    background:var(--panel2);border:1px solid var(--accent);border-radius:999px;
    padding:8px 8px 8px 16px;display:none;align-items:center;gap:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
  }
  .rest-pill.show{display:flex;}
  .rest-pill .lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;}
  .rest-pill b{color:var(--accent);font-variant-numeric:tabular-nums;font-size:1.05rem;}
  .rest-pill button{background:none;border:none;color:var(--text);font-size:1.05rem;cursor:pointer;padding:4px 8px;}

  /* ---- Video modal (Execução) — bottom-sheet ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;
    display:none;align-items:flex-end;justify-content:center;
  }

  .muscle-svg{width:100%;height:auto;}

  var ALL_MUSCLE_GROUPS = ["ombros", "peito", "biceps", "triceps", "abdomen", "costas", "gluteos", "quadriceps", "posterior_coxa", "panturrilha"];

  var PLANO = {

          {id:"a3", nome:"Agachamento livre ou leg press", series:3, reps:"8-12", rir:"3-4", obs:"Amplitude confortável, sem dor articular."},
          {id:"a4", nome:"Desenvolvimento de ombro (halteres/máquina)", series:2, reps:"10-12", rir:"3-4", obs:""},
          {id:"a5", nome:"Prancha abdominal", series:3, reps:"30-40s", rir:"—", obs:"Reps = segundos sustentados."}
        ]
      },
      B: {
        nome: "Full-Body B",
        aquecimento: "5 min de mobilidade articular geral + 1 série leve de aquecimento no 1º exercício antes de valer.",
        duracaoEstimada: "50-55 min",
        exercicios: [
          {id:"b1", nome:"Supino inclinado ou crucifixo", series:3, reps:"8-12", rir:"3-4", obs:"Grupamento que você mais gosta — aproveite."},
          {id:"b2", nome:"Puxada frontal ou remada unilateral", series:3, reps:"8-12", rir:"3-4", obs:""},
          {id:"b3", nome:"Levantamento terra romeno ou cadeira ext.+flex.", series:3, reps:"8-12", rir:"3-4", obs:""},
          {id:"b4", nome:"Elevação lateral", series:2, reps:"12-15", rir:"3-4", obs:""},
          {id:"b5", nome:"Prancha lateral (cada lado)", series:2, reps:"20-30s", rir:"—", obs:""}
        ]
      },
      COND: {
        nome: "Condicionamento geral",
        aquecimento: "3-5 min de caminhada leve antes de acelerar.",
        duracaoEstimada: "20-30 min",
        exercicios: [
          {id:"c1", nome:"Caminhada rápida ou trote leve contínuo", series:1, reps:"20-25 min", rir:"RPE 4-5/10", obs:"Ritmo que ainda permite conversar (zona 2 aproximada). Registre FC média no Apple Watch se possível."}
        ]
      }
    }
  };

  var TABS = ["dashboard","treino","historico","progresso","analise","objetivos"];
  var TITLES = {dashboard:"Dashboard", treino:"Treino", historico:"Histórico", progresso:"Progresso", analise:"Análise", objetivos:"Metas"};

  var state = {
    sessions: [],
    watch: [],
    subjective: [],
    body: [],
    activeTab: "dashboard",
    todaySessionKey: null
  };

  /* =========================================================
     LOCK / AUTH
     ========================================================= */
  function sha256(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }

  function tryUnlock(){
    var val = document.getElementById("pw").value || "";
    sha256(val).then(function(hash){
      if(hash === PASSWORD_HASH){
        try{ localStorage.setItem(LOCK_FLAG, "1"); }catch(e){}
        showApp();
      } else {
        document.getElementById("lockErr").textContent = "Senha incorreta.";
      }
    });
  }

  function showApp(){
    document.getElementById("lock").style.display = "none";
    document.getElementById("app").style.display = "block";
    signInAndLoad();
  }

  document.getElementById("btnEnter").addEventListener("click", tryUnlock);
  document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter") tryUnlock(); });

  var alreadyUnlocked = false;
  try{ alreadyUnlocked = localStorage.getItem(LOCK_FLAG) === "1"; }catch(e){}
  if(alreadyUnlocked){ showApp(); }

  function signInAndLoad(){
    auth.signInAnonymously().then(function(){
      loadAll();
    }).catch(function(err){
      console.error("Falha no login anônimo do Firebase:", err);
      showToast("Não foi possível conectar ao banco de dados agora. Verifique sua conexão e recarregue a página.", true);
    });
  }

  /* =========================================================
     DATA LAYER
     ========================================================= */
  function loadAll(){
    Promise.all([
      db.collection(COL.sessions).orderBy("data","desc").limit(60).get(),
      db.collection(COL.watch).orderBy("data","desc").limit(30).get(),
      db.collection(COL.subjective).orderBy("data","desc").limit(30).get(),
      db.collection(COL.body).orderBy("data","desc").limit(60).get()
    ]).then(function(results){
      state.sessions = results[0].docs.map(docToObj);
      state.watch = results[1].docs.map(docToObj);
      state.subjective = results[2].docs.map(docToObj);
      state.body = results[3].docs.map(docToObj);
      renderAll();
    }).catch(function(err){
      console.error("Erro ao carregar dados:", err);
      renderAll();
    });
  }

  function docToObj(doc){ var o = doc.data(); o._id = doc.id; return o; }

  function showToast(msg, isError){
    var wrap = document.getElementById("toast");
    var el = document.createElement("div");
    el.className = "msg" + (isError ? " err" : "");
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("show"); });
    setTimeout(function(){
      el.classList.remove("show");
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 250);
    }, 4500);
  }

  function todayISO(){
    var d = new Date();
    var tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return tz.toISOString().slice(0,10);
  }

  function fmtDateBR(iso){
    var p = iso.split("-");
    return p[2] + "/" + p[1] + "/" + p[0];
  }

  /* =========================================================
     TIMERS — cronômetro por exercício + cronômetro de descanso
     Arquitetura: um único setInterval global ("tick") recalcula os
     tempos a partir de timestamps reais (Date.now()), e atualiza só
     os elementos de texto via getElementById — não depende de
     re-render do innerHTML, então sobrevive a qualquer redesenho da
     tela e não perde o estado dos inputs de carga/reps.
     ========================================================= */
  var timerState = {
    exercise: {},                              // exId -> {running, startedAt, elapsed}
    rest: {running:false, startedAt:0, total:0, remainingAtPause:0}
  };

  function fmtTime(totalSec){
    totalSec = Math.max(0, Math.round(totalSec));
    var m = Math.floor(totalSec/60), s = totalSec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  function getExTimer(exId){
    if(!timerState.exercise[exId]) timerState.exercise[exId] = {running:false, startedAt:0, elapsed:0};
    return timerState.exercise[exId];
  }

  function exTimerCurrentSeconds(exId){
    var t = getExTimer(exId);
    return t.elapsed + (t.running ? (Date.now()-t.startedAt)/1000 : 0);
  }

  function toggleExerciseTimer(exId){
    var t = getExTimer(exId);
    if(t.running){
      t.elapsed += (Date.now()-t.startedAt)/1000;
      t.running = false;
    } else {
      t.startedAt = Date.now();
      t.running = true;
    }
    updateExerciseTimerUI(exId);
  }

  function updateExerciseTimerUI(exId){
    var disp = document.getElementById("exTimerDisplay-"+exId);
    var btn = document.getElementById("exTimerBtn-"+exId);
    if(disp) disp.textContent = fmtTime(exTimerCurrentSeconds(exId));
    if(btn) btn.textContent = getExTimer(exId).running ? "⏸" : "▶";
  }

  function resetAllTimers(){
    timerState.exercise = {};
    resetRestTimer();
  }

  function startRestTimer(sec){
    timerState.rest = {running:true, startedAt:Date.now(), total:sec, remainingAtPause:0};
    var pill = document.getElementById("restPill");
    if(pill) pill.classList.add("show");
    var pauseBtn = document.getElementById("restPillPauseBtn");
    if(pauseBtn) pauseBtn.textContent = "⏸";
    updateRestPillDisplay(sec);
  }

  function updateRestPillDisplay(remaining){
    var el = document.getElementById("restPillTime");
    if(el) el.textContent = fmtTime(remaining);
  }

  function pauseResumeRest(){
    var r = timerState.rest;
    if(!r || (!r.running && !r.remainingAtPause)) return;
    if(r.running){
      r.remainingAtPause = r.total - (Date.now()-r.startedAt)/1000;
      r.running = false;
    } else {
      r.startedAt = Date.now();
      r.total = r.remainingAtPause;
      r.running = true;
    }
    var pauseBtn = document.getElementById("restPillPauseBtn");
    if(pauseBtn) pauseBtn.textContent = r.running ? "⏸" : "▶";
  }

  function resetRestTimer(){
    timerState.rest = {running:false, startedAt:0, total:0, remainingAtPause:0};
    var pill = document.getElementById("restPill");
    if(pill) pill.classList.remove("show");
  }

  function playBeep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
      o.connect(g); g.connect(ctx.destination);
      o.start();

  function ultimaSessaoTipo(){
    var academiaSessions = state.sessions.filter(function(s){ return s.sessaoTipo === "A" || s.sessaoTipo === "B"; });
    if(academiaSessions.length === 0) return null;
    return academiaSessions[0].sessaoTipo;

  function proximaSessaoSugerida(){
    var ultima = ultimaSessaoTipo();

  function calcStreak(){
    if(state.sessions.length === 0) return 0;
    var dates = state.sessions.map(function(s){ return s.data; }).sort().reverse();
    var streak = 0;
    var cursor = new Date(todayISO());
    for(var i=0;i<dates.length;i++){
      var d = new Date(dates[i]);
      var diffDays = Math.round((cursor - d) / 86400000);
      if(diffDays <= (streak===0?2:4)){ streak++; cursor = d; } else { break; }
    }
    return streak;
  }

  /* =========================================================

  function renderWeekStrip(){
    var DOW = ["D","S","T","Q","Q","S","S"];
    var todaysISO = todayISO();
    var trainedDates = {};
    state.sessions.forEach(function(s){ trainedDates[s.data] = true; });
    var html = '<div class="week-strip">';
    for(var i=6;i>=0;i--){
      var d = new Date(todaysISO);
      d.setDate(d.getDate() - i);
      var iso = d.toISOString().slice(0,10);
      var isToday = iso === todaysISO;
      var trained = !!trainedDates[iso];
      html += '<div class="week-day' + (trained?' trained':'') + (isToday?' today':'') + '">' +
        '<span class="dow">' + DOW[d.getDay()] + '</span>' +
        '<span class="dot">' + (trained ? '✓' : d.getDate()) + '</span>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  /* =========================================================
     MAPA MUSCULAR
     Status calculado só a partir de dados objetivos já registrados
     (datas de treino + séries marcadas OK) — não é interpretação de
     fadiga subjetiva (essa continua sendo feita em conversa, ver
     regra do CLAUDE.md). Categorias:
       vermelho = treinado HOJE
       azul     = treinado nas últimas 48h, sem contar hoje (janela de
                  síntese proteica)
       amarelo  = já treinado antes, mas < 12 séries na última semana
                  (abaixo da meta de volume, Pelland et al. 2025)
       verde    = recuperado/pronto (ou ainda sem dados)
     ========================================================= */
  function computeMuscleStatus(){
    var ALL_GROUPS = ALL_MUSCLE_GROUPS;
    var status = {};
    ALL_GROUPS.forEach(function(mg){ status[mg] = {status:"verde", diasDesde:null, seriesSemana:0}; });
    if(state.sessions.length === 0) return status;

    var today = new Date(todayISO());
    var last7Cutoff = new Date(today.getTime() - 7*86400000);
    var lastDateByGroup = {};
    var weekSetsByGroup = {};

    state.sessions.forEach(function(s){
      if(!s.exercicios) return;
      Object.keys(MUSCLE_MAP).forEach(function(exId){
        if(!s.exercicios[exId]) return;
        var okSets = s.exercicios[exId].filter(function(r){ return r.ok; }).length;
        if(okSets === 0) return;
        MUSCLE_MAP[exId].forEach(function(mg){
          if(!lastDateByGroup[mg] || s.data > lastDateByGroup[mg]) lastDateByGroup[mg] = s.data;
          if(new Date(s.data) >= last7Cutoff) weekSetsByGroup[mg] = (weekSetsByGroup[mg]||0) + okSets;
        });
      });
    });

    ALL_GROUPS.forEach(function(mg){
      var lastDate = lastDateByGroup[mg] || null;
      var diasDesde = lastDate ? Math.round((today - new Date(lastDate)) / 86400000) : null;
      var seriesSemana = weekSetsByGroup[mg] || 0;
      // "Vermelho" é sobre RECÊNCIA (treinado hoje), não sobre qual foi a
      // última sessão registrada no histórico — senão um grupamento treinado
      // só uma vez há muito tempo ficaria vermelho pra sempre.
      var st = "verde";
      if(diasDesde === 0) st = "vermelho";
      else if(diasDesde !== null && diasDesde <= 2) st = "azul";
      else if(diasDesde !== null && seriesSemana < 12) st = "amarelo";
      status[mg] = {status: st, diasDesde: diasDesde, seriesSemana: seriesSemana};
    });
    return status;
  }

  // Desenha uma forma (path/rect/ellipse) do lado esquerdo do corpo e devolve
  // ELA + uma cópia espelhada (mesmo "d", mesma cor) do lado direito, usando
  // transform SVG em vez de recalcular coordenadas na mão — assim cada par
  // simétrico de músculo (ombro, braço, perna) só precisa ser desenhado uma
  // vez. O espelho é em torno do eixo x=100 (metade de um viewBox 0 0 200 *).
  function mirroredShape(tag, attrs, mg, fill){
    var attrStr = Object.keys(attrs).map(function(k){ return k + '="' + attrs[k] + '"'; }).join(" ");
    var mgAttr = mg ? ' class="mm-shape" data-mg="' + mg + '"' : "";
    var fillAttr = fill ? ' fill="' + fill + '"' : "";
    var el = '<' + tag + ' ' + attrStr + mgAttr + fillAttr + '/>';
    return el + '<g transform="translate(200,0) scale(-1,1)">' + el + '</g>';
  }

    return nome + ": trabalhado por último " + quando + " · " + info.seriesSemana + " séries nos últimos 7 dias.";
  }

  var sessaoAtual = null; // {key, registros: {exId: [{carga,reps,ok}]}}

  function iniciarSessao(key){
    var tpl = PLANO.sessoes[key];
    var registros = {};
    tpl.exercicios.forEach(function(ex){
      registros[ex.id] = [];
      for(var i=0;i<ex.series;i++){ registros[ex.id].push({carga:"", reps:"", ok:false}); }
    });
    sessaoAtual = {key: key, registros: registros, rpeGeral:"", obsGeral:""};
    resetAllTimers();
    renderTreino();
  }

  function ultimoRegistroExercicio(exId){
    for(var i=0;i<state.sessions.length;i++){
      var s = state.sessions[i];
      if(s.exercicios && s.exercicios[exId] && s.exercicios[exId].length){
        var feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.carga; });
        if(feitos.length){
          var last = feitos[feitos.length-1];
          return {data: s.data, carga: last.carga, reps: last.reps};
        }
      }
    }
    return null;
  }

  function melhorMarcaExercicio(exId){
    var melhor = null;
    state.sessions.forEach(function(s){
      if(s.exercicios && s.exercicios[exId]){
        s.exercicios[exId].forEach(function(r){
          if(r.ok && r.carga){
            var c = parseFloat(r.carga);
            if(!melhor || c > melhor) melhor = c;
          }
        });
      }
    });
    return melhor;
  }

  // Preenche a próxima série vazia com carga/reps da série anterior (ou,
  // se for a primeira série da sessão, com o último registro histórico
  // desse exercício) — só um toque de confirmação em vez de digitar de novo.
  function fillNextSetLikeLast(exId){
    var registros = sessaoAtual.registros[exId];
    var targetIdx = -1;
    for(var i=0;i<registros.length;i++){
      if(!registros[i].carga){ targetIdx = i; break; }
    }
    if(targetIdx === -1){ showToast("Todas as séries desse exercício já têm carga preenchida."); return; }

    var src = null;
    if(targetIdx > 0 && registros[targetIdx-1].carga){
      src = {carga: registros[targetIdx-1].carga, reps: registros[targetIdx-1].reps};
    } else {
      var hist = ultimoRegistroExercicio(exId);
      if(hist) src = {carga: hist.carga, reps: hist.reps};
    }
    if(!src){ showToast("Ainda não há valor anterior pra repetir nesse exercício."); return; }

    registros[targetIdx].carga = src.carga;
    registros[targetIdx].reps = src.reps;
    renderTreino();
  }

  function renderTreino(){
    var el = document.getElementById("view-treino");

    if(!sessaoAtual){
      el.innerHTML =
        '<div class="panel">' +
          '<h2>Escolha a sessão de hoje</h2>' +
          '<p class="sub">Sugestão com base no seu histórico: <b>' + proximaSessaoSugerida() + '</b></p>' +
          '<div class="daytype-row">' +
            '<button class="btn-sessao" data-s="A">Full-Body A</button>' +
            '<button class="btn-sessao" data-s="B">Full-Body B</button>' +
            '<button class="btn-sessao" data-s="COND">Condicionamento</button>' +
          '</div>' +
        '</div>';
      el.querySelectorAll(".btn-sessao").forEach(function(btn){
        btn.addEventListener("click", function(){ iniciarSessao(btn.getAttribute("data-s")); });
      });
      return;
    }

    var tpl = PLANO.sessoes[sessaoAtual.key];
    var html = '<div class="panel"><h2>' + tpl.nome + '</h2>' +
      '<p class="sub">' + tpl.aquecimento + ' · Duração estimada: ' + tpl.duracaoEstimada + '</p></div>';

    tpl.exercicios.forEach(function(ex){
      var ultimo = ultimoRegistroExercicio(ex.id);
      var melhor = melhorMarcaExercicio(ex.id);
      html += '<div class="exercise" data-ex="' + ex.id + '">' +
        '<h3>' + ex.nome + '</h3>' +
        '<div class="meta">' + ex.series + ' séries x ' + ex.reps + ' · RIR alvo ' + ex.rir +
          (ultimo ? ' · Última vez: ' + ultimo.carga + 'kg x ' + ultimo.reps : ' · Primeira vez — essa carga vira sua base') +
          (melhor ? ' · Melhor marca: ' + melhor + 'kg' : '') +
        '</div>' +
        (ex.obs ? '<div class="meta">💡 ' + ex.obs + '</div>' : '') +
        '<button class="btn small secondary btn-repeat" type="button" data-ex="' + ex.id + '">↺ Repetir última série</button>' +
        '<table class="sets"><tr><th>Série</th><th>Carga (kg)</th><th>Reps</th><th>OK</th></tr>';
      for(var i=0;i<ex.series;i++){
        var r = sessaoAtual.registros[ex.id][i];
        html += '<tr>' +
          '<td>' + (i+1) + '</td>' +
          '<td><div class="stepper">' +
            '<button class="step-btn" type="button" data-ex="' + ex.id + '" data-i="' + i + '" data-f="carga" data-op="dec" data-step="0.5">−</button>' +
            '<input type="number" inputmode="decimal" step="0.5" data-ex="' + ex.id + '" data-i="' + i + '" data-f="carga" value="' + r.carga + '">' +
            '<button class="step-btn" type="button" data-ex="' + ex.id + '" data-i="' + i + '" data-f="carga" data-op="inc" data-step="0.5">+</button>' +
          '</div></td>' +
          '<td><div class="stepper">' +
            '<button class="step-btn" type="button" data-ex="' + ex.id + '" data-i="' + i + '" data-f="reps" data-op="dec" data-step="1">−</button>' +
            '<input type="number" inputmode="numeric" data-ex="' + ex.id + '" data-i="' + i + '" data-f="reps" value="' + r.reps + '">' +
            '<button class="step-btn" type="button" data-ex="' + ex.id + '" data-i="' + i + '" data-f="reps" data-op="inc" data-step="1">+</button>' +
          '</div></td>' +
          '<td style="text-align:center"><input type="checkbox" class="chk" data-ex="' + ex.id + '" data-i="' + i + '" data-f="ok" ' + (r.ok?'checked':'') + '></td>' +
          '</tr>';
      }
      html += '</table>' +
        '<div class="ex-tools">' +
          '<div class="ex-tool-group">' +
            '<span class="ex-tool-label">Tempo</span>' +
            '<span class="ex-timer-display" id="exTimerDisplay-' + ex.id + '">' + fmtTime(exTimerCurrentSeconds(ex.id)) + '</span>' +
            '<button class="btn small secondary ex-timer-btn" type="button" data-ex="' + ex.id + '" id="exTimerBtn-' + ex.id + '">' + (getExTimer(ex.id).running ? "⏸" : "▶") + '</button>' +
          '</div>' +
          (VIDEOS[ex.id] ? '<button class="btn small secondary btn-exec" type="button" data-ex="' + ex.id + '" data-nome="' + ex.nome.replace(/"/g,"&quot;") + '">🎬 Execução</button>' : '') +
          '<div class="rest-btns">' +
            '<span class="ex-tool-label">Descanso</span>' +
            '<button class="btn small secondary rest-btn" type="button" data-sec="60">60s</button>' +
            '<button class="btn small secondary rest-btn" type="button" data-sec="90">90s</button>' +
            '<button class="btn small secondary rest-btn" type="button" data-sec="120">120s</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    });

    html += '<div class="panel">' +
      '<div class="field"><label>RPE geral da sessão (1-10)</label><input type="number" min="1" max="10" id="rpeGeral" value="' + sessaoAtual.rpeGeral + '"></div>' +
      '<div class="field"><label>Observações (dor, dificuldade, sensação)</label><textarea id="obsGeral">' + sessaoAtual.obsGeral + '</textarea></div>' +
      '<button class="btn" id="btnFinalizar">Finalizar e salvar treino</button>' +
      '<button class="btn secondary" id="btnCancelar" style="margin-top:8px;">Cancelar sessão</button>' +
    '</div>';

    el.innerHTML = html;

    el.querySelectorAll('input[type=number][data-ex], input[type=checkbox][data-ex]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var exId = inp.getAttribute("data-ex"), i = parseInt(inp.getAttribute("data-i"),10), f = inp.getAttribute("data-f");
        if(f === "ok") sessaoAtual.registros[exId][i][f] = inp.checked;
        else sessaoAtual.registros[exId][i][f] = inp.value;
      });
    });
    document.getElementById("rpeGeral").addEventListener("input", function(e){ sessaoAtual.rpeGeral = e.target.value; });
    document.getElementById("obsGeral").addEventListener("input", function(e){ sessaoAtual.obsGeral = e.target.value; });
    document.getElementById("btnFinalizar").addEventListener("click", finalizarSessao);
    document.getElementById("btnCancelar").addEventListener("click", function(){ sessaoAtual = null; resetAllTimers(); renderTreino(); });

    el.querySelectorAll(".ex-timer-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ toggleExerciseTimer(btn.getAttribute("data-ex")); });
    });
    el.querySelectorAll(".btn-exec").forEach(function(btn){
      btn.addEventListener("click", function(){ openVideoModal(btn.getAttribute("data-ex"), btn.getAttribute("data-nome")); });
    });
    el.querySelectorAll(".rest-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ startRestTimer(parseInt(btn.getAttribute("data-sec"),10)); });
    });
    el.querySelectorAll(".btn-repeat").forEach(function(btn){
      btn.addEventListener("click", function(){ fillNextSetLikeLast(btn.getAttribute("data-ex")); });
    });
    el.querySelectorAll(".step-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var exId = btn.getAttribute("data-ex"), i = parseInt(btn.getAttribute("data-i"),10), f = btn.getAttribute("data-f");
        var step = parseFloat(btn.getAttribute("data-step"));
        var op = btn.getAttribute("data-op");
        var cur = parseFloat(sessaoAtual.registros[exId][i][f]) || 0;
        var next = op === "inc" ? cur + step : Math.max(0, cur - step);
        next = Math.round(next * 100) / 100;
        sessaoAtual.registros[exId][i][f] = String(next);
        var input = el.querySelector('input[type=number][data-ex="' + exId + '"][data-i="' + i + '"][data-f="' + f + '"]');
        if(input) input.value = next;
      });
    });
  }

  function finalizarSessao(){
    var temposExercicio = {};
    Object.keys(timerState.exercise).forEach(function(exId){
      var sec = Math.round(exTimerCurrentSeconds(exId));
      if(sec > 0) temposExercicio[exId] = sec;
    });
    var doc = {
      data: todayISO(),
      sessaoTipo: sessaoAtual.key,
      nomeSessao: PLANO.sessoes[sessaoAtual.key].nome,
      exercicios: sessaoAtual.registros,
      temposExercicio: temposExercicio,
      rpeGeral: sessaoAtual.rpeGeral,
      observacoes: sessaoAtual.obsGeral,
      criadoEm: new Date().toISOString()
    };
    db.collection(COL.sessions).add(doc).then(function(){
      sessaoAtual = null;
      resetAllTimers();
      loadAll();
      setTab("dashboard");
    }).catch(function(err){
      console.error(err);
      showToast("Não foi possível salvar o treino agora. Verifique sua conexão e tente novamente antes de sair da página.", true);
    });
  }

  /* =========================================================
     HISTÓRICO
     ========================================================= */
  function renderHistorico(){
    var el = document.getElementById("view-historico");
    if(state.sessions.length === 0){
      el.innerHTML = '<div class="panel"><p class="empty">Nenhum treino registrado ainda.</p></div>';
      return;
    }
    var html = '<div class="panel"><h2>Treinos realizados</h2>';
    state.sessions.forEach(function(s){
      var totalSeries = 0, seriesFeitas = 0;
      if(s.exercicios){
        Object.keys(s.exercicios).forEach(function(k){
          s.exercicios[k].forEach(function(r){ totalSeries++; if(r.ok) seriesFeitas++; });
        });
      }
      html += '<div class="hist-item"><div class="row"><b>' + fmtDateBR(s.data) + ' · ' + (s.nomeSessao||s.sessaoTipo) + '</b>' +
        '<span>RPE ' + (s.rpeGeral||"—") + '</span></div>' +
        '<div class="row"><span>' + seriesFeitas + '/' + totalSeries + ' séries concluídas</span>' +
        (s.observacoes ? '<span>' + s.observacoes.slice(0,40) + (s.observacoes.length>40?'…':'') + '</span>' : '<span></span>') +
        '</div></div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  /* =========================================================
     PROGRESSO
     ========================================================= */
  function sparkline(points, color){
    if(points.length < 2) return '<p class="empty">Precisa de pelo menos 2 registros pra desenhar o gráfico.</p>';
    var w = 300, h = 120, pad = 10;
    var vals = points.map(function(p){ return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min === max){ min -= 1; max += 1; }
    var stepX = (w - pad*2) / (points.length - 1);
    var path = points.map(function(p,i){
      var x = pad + i*stepX;
      var y = h - pad - ((p.v - min) / (max - min)) * (h - pad*2);
      return (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function renderProgresso(){
    var el = document.getElementById("view-progresso");
    var html = "";

    // Peso corporal
    var pesos = state.body.slice().reverse().filter(function(b){ return b.peso; })
      .map(function(b){ return {v: parseFloat(b.peso), data: b.data}; });
    html += '<div class="panel"><h2>Peso corporal</h2>' + sparkline(pesos, "#ff7a29") +
      (pesos.length ? '<p class="note">Último: ' + pesos[pesos.length-1].v + 'kg em ' + fmtDateBR(pesos[pesos.length-1].data) + '</p>' : '') + '</div>';

    // Carga por exercício principal (supino como referência do bloco 0)
    var cargasSupino = [];
    state.sessions.slice().reverse().forEach(function(s){
      ["a1","b1"].forEach(function(exId){
        if(s.exercicios && s.exercicios[exId]){
          var feitos = s.exercicios[exId].filter(function(r){ return r.ok && r.carga; });
          if(feitos.length){ cargasSupino.push({v: parseFloat(feitos[feitos.length-1].carga), data: s.data}); }
        }
      });
    });
    html += '<div class="panel"><h2>Carga · Supino (reto/inclinado)</h2>' + sparkline(cargasSupino, "#ffa94d") + '</div>';

    // RPE ao longo do tempo
    var rpes = state.sessions.slice().reverse().filter(function(s){ return s.rpeGeral; })
      .map(function(s){ return {v: parseFloat(s.rpeGeral), data: s.data}; });
    html += '<div class="panel"><h2>RPE por sessão</h2>' + sparkline(rpes, "#ffcc66") + '</div>';

    html += '<div class="panel"><h2>Registrar peso corporal</h2>' +
      '<div class="field"><label>Peso hoje (kg)</label><input type="number" step="0.1" id="pesoHoje" placeholder="Ex: 87.5"></div>' +
      '<button class="btn" id="btnSalvarPeso">Salvar</button></div>';

    el.innerHTML = html;
    document.getElementById("btnSalvarPeso").addEventListener("click", function(){
      var v = document.getElementById("pesoHoje").value;
      if(!v) return;
      db.collection(COL.body).add({data: todayISO(), peso: v, criadoEm: new Date().toISOString()})
        .then(function(){ loadAll(); })
        .catch(function(err){ console.error(err); showToast("Não foi possível salvar agora.", true); });
    });
  }

  /* =========================================================
     ANÁLISE
     ========================================================= */
  function renderAnalise(){
    var el = document.getElementById("view-analise");
    var html = '<div class="panel">' +
      '<h2>Registrar dados do Apple Watch</h2>' +
      '<p class="sub">Dados medidos pelo relógio + sua percepção. Sem sincronização automática — é você quem digita aqui depois do treino.</p>' +
      '<div class="field"><label>Duração (min)</label><input type="number" id="wDuracao"></div>' +
      '<div class="field"><label>Distância (km, se aplicável)</label><input type="number" step="0.01" id="wDistancia"></div>' +
      '<div class="field"><label>FC média (bpm)</label><input type="number" id="wFcMedia"></div>' +
      '<div class="field"><label>FC máxima (bpm)</label><input type="number" id="wFcMax"></div>' +
      '<div class="field"><label>Calorias</label><input type="number" id="wCalorias"></div>' +
      '<div class="field"><label>RPE desse esforço (1-10)</label><input type="number" min="1" max="10" id="wRpe"></div>' +
      '<div class="field"><label>Sono da noite anterior (horas aprox.)</label><input type="number" step="0.5" id="wSono"></div>' +
      '<div class="field"><label>Sensação de recuperação/fadiga</label><textarea id="wObs" placeholder="Ex: senti mais cansado que o normal, dor leve no ombro, etc."></textarea></div>' +
      '<button class="btn" id="btnSalvarAnalise">Salvar registro</button>' +
      '<p class="note">Depois de salvar, traga esses números pra nossa conversa — a interpretação (o que isso significa pro próximo treino) eu faço com você, não um algoritmo automático aqui dentro.</p>' +
      '</div>';

    html += '<div class="panel"><h2>Registros anteriores</h2>';
    if(state.watch.length === 0){
      html += '<p class="empty">Nenhum registro ainda.</p>';
    } else {
      state.watch.forEach(function(w){
        html += '<div class="hist-item"><div class="row"><b>' + fmtDateBR(w.data) + '</b><span>RPE ' + (w.rpe||"—") + '</span></div>' +
          '<div class="row"><span>' + (w.duracao?w.duracao+"min":"") + (w.distancia?" · "+w.distancia+"km":"") + (w.fcMedia?" · FC méd "+w.fcMedia:"") + '</span><span></span></div></div>';
      });
    }
    html += '</div>';

    el.innerHTML = html;
    document.getElementById("btnSalvarAnalise").addEventListener("click", function(){
      var doc = {
        data: todayISO(),
        duracao: document.getElementById("wDuracao").value,
        distancia: document.getElementById("wDistancia").value,
        fcMedia: document.getElementById("wFcMedia").value,
        fcMax: document.getElementById("wFcMax").value,
        calorias: document.getElementById("wCalorias").value,
        rpe: document.getElementById("wRpe").value,
        sono: document.getElementById("wSono").value,
        observacoes: document.getElementById("wObs").value,
        criadoEm: new Date().toISOString()
      };
      db.collection(COL.watch).add(doc).then(function(){ loadAll(); setTab("analise"); })
        .catch(function(err){ console.error(err); showToast("Não foi possível salvar agora.", true); });
    });
  }

  /* =========================================================
     OBJETIVOS
     ========================================================= */
  var METAS = [
    {prazo:"4 semanas", texto:"Completar 70-80% das sessões planejadas, progressão de carga documentada nos exercícios principais, e 1º teste de referência de condicionamento registrado."},
    {prazo:"3 meses", texto:"Ganho de força mensurável nos principais movimentos, melhora perceptível de resistência vs. linha de base do mês 1, refeição extra incorporada como hábito."},
    {prazo:"6-12 meses", texto:"Composição corporal: aproximadamente -3% a -5% de gordura corporal e +1 a 3kg de massa magra. Condicionamento com FC mais eficiente para o mesmo esforço, com transferência real pro tênis."}
  ];

  function renderObjetivos(){
    var el = document.getElementById("view-objetivos");
    var html = '<div class="panel"><h2>Objetivo principal</h2>' +
      '<p class="sub">Composição corporal + condicionamento físico, com transferência real pro tênis, e eficiência cardiovascular (FC menor para o mesmo esforço).</p></div>';
    html += '<div class="panel"><h2>Metas por prazo</h2>';
    METAS.forEach(function(m){
      html += '<div class="goal-item"><h4>' + m.prazo + '</h4><p>' + m.texto + '</p></div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

})();
</script>
